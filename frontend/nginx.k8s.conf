server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend-service:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Loopback-only, not exposed on 8080/8443 with everything else - stub_status
# reports connection-level stats only (active/accepted/handled connections,
# never HTTP status codes; see helm/devops-app for why HighErrorRate is
# backend-side, not here). Scraped by the nginx-prometheus-exporter sidecar
# in the same Pod (helm/devops-app/templates/deployments.yaml), which reads
# this over the Pod's own loopback interface and re-exposes it in
# Prometheus format on :9113 - nothing outside this Pod can ever reach
# this endpoint directly.
server {
    listen 127.0.0.1:8081;
    server_name _;

    location /stub_status {
        stub_status;
    }
}

# Same content over HTTPS with a self-signed certificate (issued by
# cert-manager, mounted from the frontend-tls-cert Secret - see
# helm/devops-app/templates/certificate.yaml). Browsers will show a "not
# trusted" warning since it isn't signed by a real CA - expected, since
# there's no owned domain name for a real cert. Port 80 above still works too.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend-service:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
