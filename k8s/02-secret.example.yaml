# DB_HOST / S3_BUCKET_NAME / SNS_TOPIC_ARN live in the ConfigMap (01-configmap.yaml)
# since they aren't sensitive. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY used to live
# here too, but backend-sa/worker-sa now get AWS access via IRSA instead (see the
# README's Security section) - no long-lived AWS keys anywhere in the cluster at all.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_PASSWORD: "your-db-password"
