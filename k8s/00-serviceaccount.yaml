# frontend-sa never needs AWS access, so it's just a plain ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: devops-app

---
# backend-sa and worker-sa are NOT declared here on purpose. They're created by
# `eksctl create iamserviceaccount` in setup.sh instead, because IRSA requires
# annotating the ServiceAccount with an IAM role ARN that only exists after the
# cluster's OIDC provider is set up - that ARN is account/cluster-specific and
# can't be hardcoded into a static manifest. See setup.sh and the README's
# Security section for the full explanation.
