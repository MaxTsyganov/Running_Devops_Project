# Allows all inbound traffic (it's the public entry point) but restricts
# outbound to just the backend service and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {} # allow all inbound
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5000
  - ports:
    - protocol: UDP
      port: 53 # DNS resolution

---
# Only accepts traffic from frontend; no egress restriction since backend
# needs to reach RDS, S3, and SNS out on the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 5000

---
# Worker only makes outbound calls (DB, SNS) and accepts no inbound
# connections from anywhere, including other pods in this cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-network-policy
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
  - Ingress
  ingress: [] # empty list = deny all inbound
