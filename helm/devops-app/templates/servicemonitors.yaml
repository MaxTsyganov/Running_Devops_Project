# Discovered cluster-wide by Prometheus (see observability/values.yaml:
# serviceMonitorSelectorNilUsesHelmValues: false), so nothing here needs a
# release-specific label to be picked up.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
spec:
  # Matches only frontend-metrics-service, not the public frontend-service -
  # the extra component: metrics label keeps the selector precise.
  selector:
    matchLabels:
      app: frontend
      component: metrics
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
