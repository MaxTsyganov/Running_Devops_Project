apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  # maxSurge: 0 - on the original t3.small nodes, the default strategy's
  # old+new pods coexisting briefly during a rollout hit real "Insufficient
  # memory" and "Too many pods" scheduling failures. maxUnavailable: 1 frees
  # an old pod before creating its replacement instead, trading a few
  # seconds of reduced capacity for never needing surge headroom. Kept even
  # after moving to t3.medium - still a fine trade for a low-traffic demo app.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
      - name: frontend
        image: {{ .Values.image.registry }}/devops-frontend:{{ .Values.image.tag }}
        ports:
        - containerPort: 8080
        - containerPort: 8443
        resources:
          requests:
            cpu: {{ .Values.frontend.resources.requests.cpu | quote }}
            memory: {{ .Values.frontend.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.frontend.resources.limits.cpu | quote }}
            memory: {{ .Values.frontend.resources.limits.memory | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-pid
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: tls-cert
          mountPath: /etc/nginx/tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-pid
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: tls-cert
        secret:
          secretName: frontend-tls-cert

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  # See frontend-deployment above for why maxSurge: 0.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backend
        image: {{ .Values.image.registry }}/devops-backend:{{ .Values.image.tag }}
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: {{ .Values.backend.resources.requests.cpu | quote }}
            memory: {{ .Values.backend.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.backend.resources.limits.cpu | quote }}
            memory: {{ .Values.backend.resources.limits.memory | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # See frontend-deployment above for why maxSurge: 0. With a single replica
  # this behaves like Recreate (old pod goes, then the new one comes up) -
  # intentional, not just incidental.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: worker
        image: {{ .Values.image.registry }}/devops-worker:{{ .Values.image.tag }}
        # No ports: unlike frontend/backend, this container runs no server -
        # it only opens outbound connections (DB, SNS), so there's no port
        # to declare or for a Service to target.
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: {{ .Values.worker.resources.requests.cpu | quote }}
            memory: {{ .Values.worker.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.worker.resources.limits.cpu | quote }}
            memory: {{ .Values.worker.resources.limits.memory | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # No HTTP port to probe, so both probes check a heartbeat file that
        # worker.py touches at startup and after every poll cycle instead.
        readinessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/worker_heartbeat"]
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          # Fails if the heartbeat is older than 3x POLL_INTERVAL_SECONDS,
          # meaning the loop is stuck. Reads the env var at check time (same
          # one worker.py reads, via app-config) instead of a hardcoded
          # number, so it stays correct if the poll interval ever changes.
          exec:
            command:
            - sh
            - -c
            - "test $(( $(date +%s) - $(stat -c %Y /tmp/worker_heartbeat 2>/dev/null || echo 0) )) -lt $(( ${POLL_INTERVAL_SECONDS:-30} * 3 ))"
          initialDelaySeconds: 20
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
