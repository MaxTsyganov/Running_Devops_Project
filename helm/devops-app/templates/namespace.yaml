# Templated so the chart is self-contained, but also applied once by itself
# (helm template --show-only, before this chart is ever installed for real) -
# IRSA needs this namespace to exist before `eksctl create iamserviceaccount`
# can put backend-sa/worker-sa inside it. See setup.sh step 5.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
