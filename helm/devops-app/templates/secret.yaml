# Only DB_PASSWORD lives here - AWS access goes through IRSA (see
# serviceaccount.yaml), never a Secret. setup.sh base64-encodes the password
# itself and passes it in via a temporary, git-ignored values file.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DB_PASSWORD: {{ .Values.secrets.dbPasswordB64 | quote }}
