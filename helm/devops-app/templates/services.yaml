# ClusterIP: reachable only from inside the cluster, never the internet.
# Named port so the backend ServiceMonitor can target it - /metrics is
# served on this same 5000, no separate port needed.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 5000
    targetPort: 5000

---
# LoadBalancer: the only component exposed to the internet. Kept to exactly
# two ports - an ELB provisions a public listener for every port listed
# here, so the metrics port is deliberately a separate ClusterIP Service
# below instead of a third entry on this one.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 8443

---
# ClusterIP, metrics only - see the comment above on frontend-service for why
# this is a separate Service rather than a third port on the public one.
apiVersion: v1
kind: Service
metadata:
  name: frontend-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: metrics
    port: 9113
    targetPort: metrics

---
# ClusterIP: worker's first-ever Service, exists purely for Prometheus to
# reach /metrics - the worker has no other server and initiates no inbound
# traffic of its own.
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
