# Tells External Secrets Operator where to read from - AWS Secrets Manager,
# in this account/region. No explicit auth block: this relies on the ESO
# controller pod's own IRSA-bound ServiceAccount (external-secrets-sa,
# created by setup.sh) rather than a per-store credential, since this
# project only ever needs one store reading one secret.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.awsRegion | quote }}
