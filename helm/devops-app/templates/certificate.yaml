# cert-manager issues this and writes the result into the frontend-tls-cert
# Secret the frontend Deployment already mounts. Requires the cert-manager
# CRDs and a selfsigned-issuer ClusterIssuer to already exist in the cluster
# (installed by setup.sh, not part of this chart - see README §12).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls-cert
  namespace: {{ .Release.Namespace }}
spec:
  secretName: frontend-tls-cert
  commonName: devops-app
  dnsNames:
    - devops-app
  duration: 2160h    # 90 days
  renewBefore: 360h  # 15 days
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
