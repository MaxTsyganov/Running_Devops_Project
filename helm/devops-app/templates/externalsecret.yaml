# Replaces the old plain Secret template. External Secrets Operator reads
# the real password from AWS Secrets Manager and writes app-secrets itself -
# the value never passes through this chart, Helm, or this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: {{ .Values.secrets.dbPasswordSecretName | quote }}
