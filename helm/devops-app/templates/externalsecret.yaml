# Replaces the old plain Secret template. External Secrets Operator reads
# the real password directly from AWS Secrets Manager at sync time and
# writes the resulting app-secrets Secret itself - the password value never
# passes through this chart, Helm, or the ArgoCD Application object. Only a
# secret NAME (not a value) is ever set via .Values.secrets.dbPasswordSecretName.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: {{ .Values.secrets.dbPasswordSecretName | quote }}
