# frontend-sa never needs AWS access, so it's just a plain ServiceAccount.
#
# backend-sa and worker-sa are NOT templated here: they're created by
# `eksctl create iamserviceaccount` (setup.sh, before this chart installs)
# because IRSA requires an IAM role ARN that's account/cluster-specific and
# only exists after the OIDC provider is set up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: {{ .Release.Namespace }}
