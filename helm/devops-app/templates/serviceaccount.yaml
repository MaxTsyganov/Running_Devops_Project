# frontend-sa never needs AWS access, so it's just a plain ServiceAccount.
#
# backend-sa and worker-sa are NOT templated here on purpose. They're created
# by `eksctl create iamserviceaccount` (run by setup.sh, before this chart is
# installed) because IRSA requires annotating the ServiceAccount with an IAM
# role ARN that only exists after the cluster's OIDC provider is set up - an
# ARN that's account/cluster-specific and can't be templated into a chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: {{ .Release.Namespace }}
