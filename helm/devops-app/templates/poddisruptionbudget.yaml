# PDBs only apply to voluntary disruptions (node drains, `kubectl drain`),
# not crashes. worker-deployment has none: with only 1 replica,
# `minAvailable: 1` would block node drains entirely instead of just
# slowing them down.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
