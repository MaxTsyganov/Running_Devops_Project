# Self-signed cert for the frontend, generated fresh by setup.sh on every
# install and passed in already base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-tls-cert
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crtB64 | quote }}
  tls.key: {{ .Values.tls.keyB64 | quote }}
