# app-secrets is no longer hand-managed - it's created entirely by External
# Secrets Operator (templates/externalsecret.yaml), which reads the real
# password from AWS Secrets Manager at sync time. This file documents the
# shape of what ESO produces and where it reads from.
#
# 1. The password lives in AWS Secrets Manager, provisioned by Terraform
#    (terraform/secrets.tf) from the same db_password variable used for RDS:
#
#      aws secretsmanager get-secret-value \
#        --secret-id devops-app/db-password --query SecretString --output text
#
# 2. External Secrets Operator's SecretStore + ExternalSecret
#    (templates/secretstore.yaml, templates/externalsecret.yaml) sync that
#    value into this cluster automatically as the Secret below - nobody
#    runs `kubectl create secret` for it.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
data:
  DB_PASSWORD: <populated automatically by External Secrets Operator>
