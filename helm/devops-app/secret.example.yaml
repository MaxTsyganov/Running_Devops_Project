# The app-secrets Secret is no longer built from a file like this one, and
# no longer contains a value anyone hand-manages - it's created entirely by
# External Secrets Operator (templates/externalsecret.yaml), which reads the
# real password directly from AWS Secrets Manager at sync time.
#
# This file documents the shape of what ESO produces, and how to create the
# real secret it reads from.
#
# 1. The actual password lives in AWS Secrets Manager, provisioned by
#    Terraform (terraform/secrets.tf) from the same db_password variable
#    used for RDS - one prompt in setup.sh, no separate manual step:
#
#      aws secretsmanager get-secret-value \
#        --secret-id devops-app/db-password --query SecretString --output text
#
# 2. External Secrets Operator's SecretStore + ExternalSecret (see
#    templates/secretstore.yaml and templates/externalsecret.yaml) sync that
#    value into this cluster automatically as the Secret shown below -
#    nobody ever runs `kubectl create secret` for this, and the value never
#    passes through Helm, the ArgoCD Application object, or this repo.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
data:
  DB_PASSWORD: <populated automatically by External Secrets Operator>
