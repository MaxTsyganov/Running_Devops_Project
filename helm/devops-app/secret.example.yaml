# Example of the Secret this chart creates (see templates/secret.yaml) - not
# applied directly, just here so the shape of the real object is obvious
# without mentally rendering the Helm template first.
#
# The real Secret is never built from a file like this one. setup.sh
# generates the real password, base64-encodes it, and passes it straight
# into the ArgoCD Application it applies (see ../values-dynamic.example.yaml
# for the equivalent if you're deploying by hand instead of via ArgoCD).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-app
type: Opaque
data:
  # base64 of a real database password, e.g.: echo -n 'your-password' | base64
  DB_PASSWORD: eW91ci1kYi1wYXNzd29yZA==
