# Non-sensitive defaults, safe to commit. Real infrastructure data (RDS
# endpoint, S3 bucket, AWS account ID) or secrets are left empty here -
# Jenkins CD supplies the real values at deploy time, read from a ConfigMap.
# See ../values-dynamic.example.yaml for the shape of that data, and how to
# supply it by hand instead. (TLS isn't part of any of this - see the note
# at the bottom of this file.)

image:
  # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com - set at install time
  registry: ""
  tag: v1.0.0
  # nginx-prometheus-exporter sidecar (Assignment 5) - a public, third-party
  # image, unlike the three above, so pinned by digest resolved directly
  # against Docker Hub's manifest API at the time it was pinned - same
  # "checked, not guessed" standard as jenkins/values.yaml's agent images.
  # Tag kept alongside for human readability; the digest is what's actually
  # pulled. Re-pin by re-querying the registry, not by guessing.
  nginxExporter: "nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d"

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  hpa:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

backend:
  replicas: 2
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: 300m, memory: 512Mi }
  hpa:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Non-sensitive application config (mirrors the old ConfigMap)
config:
  dbPort: "5432"
  dbName: appdb
  dbUser: postgres
  awsRegion: us-east-1
  pollIntervalSeconds: "30"
  # Real values, set at install time from Terraform outputs:
  dbHost: ""
  s3BucketName: ""
  snsTopicArn: ""
  # Same value as image.tag (the full commit SHA) - cd/Jenkinsfile passes
  # both together so the app_info metric (Assignment 5) reports the exact
  # deployed commit, not just whatever image tag happens to be running.
  releaseVersion: "unknown"

# Not a secret value - just the NAME of the AWS Secrets Manager secret that
# holds the real password. External Secrets Operator (see
# templates/externalsecret.yaml) reads the actual value from AWS at sync
# time; the password itself never passes through this chart, Helm, or this
# repo.
secrets:
  dbPasswordSecretName: ""

# TLS isn't set here at all - cert-manager issues the frontend's certificate
# directly in-cluster (see templates/certificate.yaml), so there's no value
# to pass in for it.
