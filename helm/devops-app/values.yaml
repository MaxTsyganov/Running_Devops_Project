# Non-sensitive defaults, safe to commit. Anything that's real infrastructure
# data (RDS endpoint, S3 bucket, AWS account ID) or a secret is left empty
# here - setup.sh supplies the real values directly in the ArgoCD Application
# it applies. See ../values-dynamic.example.yaml for the shape of what's
# filled in, and how to supply it by hand instead. (TLS isn't part of this at
# all - cert-manager issues that cert directly in-cluster.)

image:
  # e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com - set at install time
  registry: ""
  tag: v1.0.0

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  hpa:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

backend:
  replicas: 2
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: 300m, memory: 512Mi }
  hpa:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

# Non-sensitive application config (mirrors the old ConfigMap)
config:
  dbPort: "5432"
  dbName: appdb
  dbUser: postgres
  awsRegion: us-east-1
  pollIntervalSeconds: "30"
  # Real values, set at install time from Terraform outputs:
  dbHost: ""
  s3BucketName: ""
  snsTopicArn: ""

# Not a secret value at all - just the NAME of the AWS Secrets Manager
# secret that holds the real password. External Secrets Operator (see
# templates/externalsecret.yaml) reads the actual value directly from AWS at
# sync time; the password itself never passes through this chart, Helm, or
# the ArgoCD Application object.
secrets:
  dbPasswordSecretName: ""

# TLS isn't set here at all - cert-manager issues the frontend's certificate
# directly in-cluster (see templates/certificate.yaml), so there's no value
# to pass in for it.
