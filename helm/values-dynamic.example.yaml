# Template for deploying the chart by hand with `helm upgrade`, bypassing
# ArgoCD. setup.sh doesn't use this file at all - it builds the same values
# from Terraform outputs and embeds them directly into the ArgoCD Application
# it applies. To deploy manually instead:
#   cp helm/values-dynamic.example.yaml helm/values-dynamic.yaml
#   (edit the placeholders below, then:)
#   helm upgrade --install devops-app ./helm/devops-app \
#     --namespace devops-app --create-namespace \
#     -f helm/devops-app/values.yaml -f helm/values-dynamic.yaml
#
# The chart's Certificate resource (templates/certificate.yaml) also needs
# cert-manager and a selfsigned-issuer ClusterIssuer to already exist in the
# cluster - see setup.sh step 8 for the exact commands if setting these up
# by hand too.
#
# The chart's SecretStore/ExternalSecret (templates/secretstore.yaml,
# templates/externalsecret.yaml) need External Secrets Operator already
# installed with an IRSA-bound external-secrets-sa ServiceAccount that can
# read the Secrets Manager secret below - see setup.sh step 7 for that too.

image:
  registry: "123456789012.dkr.ecr.us-east-1.amazonaws.com"

config:
  dbHost: "your-rds-endpoint.amazonaws.com"
  s3BucketName: "your-s3-bucket-name"
  snsTopicArn: "arn:aws:sns:us-east-1:123456789012:your-topic"

# Name of the AWS Secrets Manager secret holding the real DB password
# (created by terraform/secrets.tf) - not the password itself.
secrets:
  dbPasswordSecretName: "devops-app/db-password"
