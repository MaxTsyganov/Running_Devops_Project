# NetworkPolicy objects for the jenkins namespace. Applied by
# install-jenkins.sh after the chart is up (labels below have to match what
# the controller/webhook-relay/agent pods actually run with).
#
# Enforcement prerequisite: VPC CNI NetworkPolicy support is off by default
# on EKS - setup.sh (Assignment 3, step [4/11]) already turns it on
# cluster-wide via `aws eks update-addon --addon-name vpc-cni
# --configuration-values '{"enableNetworkPolicy":"true"}'`, the same
# mechanism the app's own policies (helm/devops-app/templates/
# networkpolicies.yaml) already depend on. Nothing extra needed here.
#
# Honest limitation: this cluster's nodes reach the internet through a plain
# NAT Gateway (terraform/network.tf) - no VPC endpoints for ECR/KMS/S3.
# GitHub, ECR, AWS KMS, PyPI, and smee.io are all public internet endpoints
# with wide, non-static IP ranges, and plain Kubernetes NetworkPolicy is
# L3/L4 only (no FQDN-based egress filtering - that needs a different CNI
# feature, e.g. Cilium FQDN policies, out of scope here). So HTTPS egress to
# those destinations can only be scoped by port (443), not by destination
# IP. What these policies DO meaningfully enforce: default-deny as the
# baseline, zero lateral movement between pods inside the namespace (an
# agent pod can't reach another agent pod, or anything in devops-app), and
# no ingress to any agent/relay pod from anywhere.
#
# Two corrections made after live test runs, not caught by inspection:
#
# 1. The controller itself needs GitHub egress too, not just its ephemeral
#    agents - a Pipeline-from-SCM job makes the controller do a lightweight
#    `git fetch` to read the Jenkinsfile before it ever provisions an agent
#    Pod. The first real build here failed on exactly that.
#
# 2. ci-agent and cd-agent Pods do NOT carry a `jenkins/label: ci-agent` /
#    `jenkins/label: cd-agent` label the way the Jenkinsfiles' `inheritFrom
#    'ci-agent'` naming suggested. The Kubernetes plugin stamps each
#    dynamically-provisioned Pod with `jenkins/label: <job-name>_<build>-
#    <random>` (e.g. `ci-application_2-6cjfx`) - a per-build, per-provision
#    value, not the pod template's name. The only label EVERY agent Pod
#    actually shares, confirmed live via `kubectl get pods --show-labels`,
#    is the static `jenkins: slave`. There is no stable label that
#    distinguishes a ci-agent Pod from a cd-agent Pod, so - since both
#    templates already needed the identical broad-443/JNLP/DNS egress
#    shape in this design anyway - they're one combined policy below
#    instead of two, rather than a NetworkPolicy that looks like it
#    separates them but actually never matched either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-default-deny-all
  namespace: jenkins
spec:
  podSelector: {} # every pod in this namespace
  policyTypes:
    - Ingress
    - Egress
  # No rules under either key = deny all by default. Everything below is an
  # additive allow on top of this baseline (NetworkPolicy semantics: a pod
  # governed by multiple policies gets the union of their rules).

---
# Controller: only ephemeral agent pods (JNLP) and webhook-relay (the
# internal /github-webhook/ POST) ever need to reach it. Egress needs the
# Kubernetes API (to launch/watch/delete agent Pods) plus GitHub - confirmed
# live the hard way: a Pipeline-from-SCM job (CpsScmFlowDefinition) makes
# the CONTROLLER itself do a lightweight `git fetch` to read the Jenkinsfile
# before it ever provisions an agent Pod, not just the agent-side checkout
# stage later. The first real build here failed on exactly that - the
# controller's own git fetch to github.com timing out - before this rule
# existed. ECR/KMS/PyPI remain agent-only (no evidence the controller ever
# calls them, and nothing in this job type would make it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-controller-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              jenkins: slave # every dynamically-provisioned agent Pod (ci-agent and cd-agent alike) - see header comment #2 for why this is the only label that actually matches them
        - podSelector:
            matchLabels:
              app: webhook-relay
      ports:
        - protocol: TCP
          port: 50000 # JNLP agent tunnel (jenkinsTunnel in values.yaml)
        - protocol: TCP
          port: 8080 # agent HTTP handshake + webhook-relay's POST target
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # this cluster's Kubernetes Service CIDR (`aws eks describe-cluster ... kubernetesNetworkConfig.serviceIpv4Cidr`) - NOT the VPC CIDR (10.0.0.0/16, terraform/network.tf). Confirmed live: an earlier version of this rule used the VPC CIDR, which silently blocked the controller's watch connection to kubernetes.default.svc (172.20.0.1) - AWS VPC CNI's NetworkPolicy enforcement matches the Service's ClusterIP itself, not the real backend IP the CNI later DNATs to.
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than an omitted `to:` (the spec treats both as "match all destinations") - easier for a reader to see this is deliberately unrestricted, not a rule that forgot its `to:`.
      ports:
        - protocol: TCP
          port: 443 # GitHub - the controller's own lightweight Jenkinsfile checkout (see header comment above). Can't be scoped by IP, same reasoning as the agent policy below.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# webhook-relay: holds an outbound SSE connection to smee.io and forwards to
# the controller's ClusterIP - see jenkins/webhook-relay.yaml's own header
# for why this exists. Nothing ever calls into it, so ingress is denied
# entirely by the base policy above and never re-opened here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-relay-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app: webhook-relay
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than omitted - see jenkins-controller-policy's egress comment for why
      ports:
        - protocol: TCP
          port: 443 # smee.io - public endpoint, can't be scoped by IP (see header)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Agent Pods (both ci-agent and cd-agent templates - see header comment #2
# for why these are one policy, not two): ci-agent checks out from GitHub,
# builds with Kaniko, pushes to ECR, scans + SBOMs with Trivy, and signs
# with Cosign via KMS; cd-agent checks out the Helm chart from GitHub and
# calls the in-cluster Kubernetes API (kubectl/helm) to deploy into
# devops-app. All outbound HTTPS to public AWS/GitHub/PyPI endpoints (see
# header re: port-only scoping), plus the JNLP callback to the controller.
# Accepts no ingress from anywhere (nothing ever initiates a connection to
# a build agent).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-agent-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      jenkins: slave
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 50000
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than omitted - see jenkins-controller-policy's egress comment for why
      ports:
        - protocol: TCP
          port: 443 # GitHub, ECR, AWS KMS, PyPI, Cosign/Trivy-DB downloads, and (for cd-agent) the in-VPC Kubernetes API
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # this cluster's Service CIDR, same one and same reason as
            # jenkins-controller-policy's Kubernetes-API rule - NOT a podSelector for
            # `app: frontend`, even though that's what was tried first and is what the
            # comment below explains. cd-agent's Smoke Test hits frontend-service by its
            # in-cluster Service DNS, and a podSelector rule for `app: frontend` resolves
            # correctly at the control-plane level (confirmed via the generated
            # PolicyEndpoint object listing the real frontend Pod IPs) but is never
            # actually matched at enforcement time: AWS VPC CNI's NetworkPolicy agent
            # evaluates egress against the pre-DNAT destination - the Service's ClusterIP
            # - not the Pod IP kube-proxy later rewrites it to, so traffic to the Service
            # never matched a Pod-IP-scoped rule at all. Confirmed live three ways: a
            # podSelector rule timed out against both the ClusterIP and the DNS name;
            # curling a frontend Pod's IP directly got a real "connection refused" (its
            # container listens on 8080/8443, not 80 - the Service does that mapping, so
            # this proves the packet WAS reaching the Pod when addressed directly, just
            # not through the Service); and this ipBlock, once applied, worked instantly
            # on the very same ClusterIP and DNS name that timed out before. Still tighter
            # than port 443's necessarily-unpredictable 0.0.0.0/0 above (GitHub/ECR/KMS/
            # PyPI/smee.io) - this is scoped to "anything inside this cluster," not the
            # open internet, since port 80 has exactly one real destination in this whole
            # pipeline. Also grants ci-agent pods this same access, since both templates
            # share one policy (see header comment #2) - harmless, since nothing in
            # ci-agent's own steps ever makes any HTTP call anywhere in-cluster.
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
