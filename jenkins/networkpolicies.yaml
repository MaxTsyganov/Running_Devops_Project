# NetworkPolicy objects for the jenkins namespace. Applied by install-jenkins.sh
# after the chart is up (labels below must match the controller/webhook-relay/agent pods).
#
# Enforcement prerequisite: VPC CNI NetworkPolicy support is off by default on EKS -
# setup.sh already enables it cluster-wide, the same mechanism the app's own
# policies (helm/devops-app/templates/networkpolicies.yaml) depend on.
#
# Honest limitation: nodes reach the internet via a plain NAT Gateway (no VPC
# endpoints for ECR/KMS/S3), and plain NetworkPolicy is L3/L4 only - no
# FQDN-based egress filtering. So HTTPS to GitHub/ECR/KMS/PyPI/smee.io can only
# be scoped by port (443), not destination IP. What these policies DO enforce:
# default-deny baseline, zero lateral movement between pods in the namespace,
# and no ingress to any agent/relay pod.
#
# Two corrections made after live test runs:
# 1. The controller itself needs GitHub egress too - a Pipeline-from-SCM job
#    makes it `git fetch` the Jenkinsfile before provisioning an agent Pod.
# 2. ci-agent/cd-agent Pods don't carry a stable per-template label - the
#    Kubernetes plugin stamps each with a per-build `jenkins/label` value
#    instead. The only label every agent Pod shares (confirmed via `kubectl
#    get pods --show-labels`) is the static `jenkins: slave`, so both
#    templates share one combined policy below instead of two.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-default-deny-all
  namespace: jenkins
spec:
  podSelector: {} # every pod in this namespace
  policyTypes:
    - Ingress
    - Egress
  # No rules under either key = deny all by default. Everything below is an
  # additive allow on top of this baseline (NetworkPolicy semantics: a pod
  # governed by multiple policies gets the union of their rules).

---
# Controller: only ephemeral agent pods (JNLP) and webhook-relay (the internal
# /github-webhook/ POST) ever need to reach it. Egress needs the Kubernetes API
# plus GitHub (header #1); ECR/KMS/PyPI remain agent-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-controller-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              jenkins: slave # every dynamically-provisioned agent Pod (ci-agent and cd-agent alike) - see header #2
        - podSelector:
            matchLabels:
              app: webhook-relay
      ports:
        - protocol: TCP
          port: 50000 # JNLP agent tunnel (jenkinsTunnel in values.yaml)
        - protocol: TCP
          port: 8080 # agent HTTP handshake + webhook-relay's POST target
    # Assignment 5: Prometheus (observability namespace) scrapes /prometheus on
    # this port - no auth needed, so no basicAuth/bearerToken on the ServiceMonitor side.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # cluster's Service CIDR, NOT the VPC CIDR (10.0.0.0/16, terraform/network.tf). An earlier version used the VPC CIDR, which silently blocked the controller's watch on kubernetes.default.svc - VPC CNI matches the Service's ClusterIP, not the backend IP it DNATs to.
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than an omitted `to:` - makes clear this is deliberately unrestricted, not a rule that forgot its `to:`.
      ports:
        - protocol: TCP
          port: 443 # GitHub - the controller's own lightweight Jenkinsfile checkout (header #1). Can't be scoped by IP, same reasoning as the agent policy below.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# webhook-relay: outbound SSE to smee.io, forwarded to the controller's ClusterIP
# (see jenkins/webhook-relay.yaml). Nothing calls into it, so ingress stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-relay-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app: webhook-relay
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than omitted - see jenkins-controller-policy's egress comment for why
      ports:
        - protocol: TCP
          port: 443 # smee.io - public endpoint, can't be scoped by IP (see header)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Agent Pods (ci-agent and cd-agent share one policy - see header #2): ci-agent
# builds/scans/signs and pushes to ECR; cd-agent deploys via the in-cluster
# Kubernetes API. Outbound HTTPS to AWS/GitHub/PyPI plus the JNLP callback to
# the controller. No ingress accepted from anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-agent-policy
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      jenkins: slave
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 50000
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # explicit rather than omitted - see jenkins-controller-policy's egress comment for why
      ports:
        - protocol: TCP
          port: 443 # GitHub, ECR, AWS KMS, PyPI, Cosign/Trivy-DB downloads, and (for cd-agent) the in-VPC Kubernetes API
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # Service CIDR, not a podSelector for `app: frontend`: AWS
            # VPC CNI evaluates egress against the pre-DNAT ClusterIP, not the Pod IP
            # kube-proxy rewrites to, so a Pod-IP-scoped rule never matches Service traffic
            # (confirmed live - podSelector timed out, this ipBlock worked instantly on the
            # same target). Also grants ci-agent this access via the shared policy (header
            # #2) - harmless, ci-agent makes no in-cluster HTTP calls.
            # Port 9090 added for Assignment 5's Monitoring Gate (jenkins/cd/Jenkinsfile) -
            # same pre-DNAT-ClusterIP reasoning applies to Prometheus.
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
