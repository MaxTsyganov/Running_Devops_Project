# Example only - real credential IDs/values are never committed.
# Documents which Jenkins Credentials this project expects to exist, and what
# each one is scoped to. Actual creation instructions go in the README.

credentials:
  - id: git-webhook-secret
    type: Secret text
    usedBy: ci-application (validates incoming SCM webhook)
    note: Not an AWS/registry credential - ECR auth goes through IRSA instead,
      so no static registry password needs to live in Jenkins at all.
