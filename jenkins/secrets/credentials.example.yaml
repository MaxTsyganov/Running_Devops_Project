# Example only - real credential IDs/values are never committed.
# Documents which Jenkins Credentials this project expects to exist, and what
# each one is scoped to. Actual creation instructions go in the README.

credentials:
  - id: git-webhook-secret
    type: Secret text
    usedBy: webhook-relay (HMAC-verifies every GitHub delivery before forwarding
      it anywhere), ci-application (githubPush() trigger), ci-application-pr
      (generic-webhook-trigger)
    note: Two keys, not one - "text" is the HMAC shared secret GitHub signs
      every delivery with; "pr-token" is the separate routing token
      ci-application-pr's webhook endpoint expects, generated alongside it and
      substituted into that job's config.xml at apply time by create-jobs.sh.
      Not an AWS/registry credential either way - ECR auth goes through IRSA
      instead, so no static registry password needs to live in Jenkins at all.
  - id: slack-webhook-url
    type: Secret text
    usedBy: ci-application, cd-application (jenkins/shared-library/vars/notifySlack.groovy)
    note: Optional (bonus feature) - a Slack Incoming Webhook URL. Created by
      configure-jenkins.sh only if $SLACK_WEBHOOK_URL is set when it runs;
      CI/CD both work fine without it, notifications just don't send.
