# Assignment 5 - discovered cluster-wide by Prometheus (observability/values.yaml:
# serviceMonitorNamespaceSelector: {}), same as helm/devops-app's ServiceMonitors.
# Targets the existing jenkins Service - the prometheus plugin serves /prometheus
# on this same port, unauthenticated, so no basicAuth/bearerToken needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jenkins-servicemonitor
  namespace: jenkins
  labels:
    app.kubernetes.io/component: jenkins-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  endpoints:
  - port: http
    path: /prometheus
    interval: 30s
