# ServiceAccount for the CI agent Pod. Deliberately has no Role/RoleBinding:
# CI builds, tests, scans, and pushes to ECR - it never talks to the
# Kubernetes API, so it gets zero Kubernetes RBAC permissions. Its only
# access is to AWS (ECR push) via IRSA, kept separate from cd-deploy-sa's
# Kubernetes RBAC in jenkins/rbac/cd-deploy-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-build-sa
  namespace: jenkins
  annotations:
    eks.amazonaws.com/role-arn: ""  # TODO: IRSA role ARN once the matching
                                      # IAM policy (ECR push only) exists
