# RBAC for the CD agent Pod. The ServiceAccount object lives in the jenkins
# namespace - CD agent Pods are scheduled there (same as the controller and
# CI agents), and a Pod can only use a ServiceAccount from its own namespace.
# The Role it's bound to grants access only in devops-app (where it needs to
# act), via a cross-namespace RoleBinding - a normal, supported RBAC pattern:
# the Role/RoleBinding live in devops-app, the subject they name lives in
# jenkins.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd-deploy-sa
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-deploy
  namespace: devops-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cd-deploy
  namespace: devops-app
subjects:
  - kind: ServiceAccount
    name: cd-deploy-sa
    namespace: jenkins
roleRef:
  kind: Role
  name: cd-deploy
  apiGroup: rbac.authorization.k8s.io
---
# Namespace is cluster-scoped, so no namespace-scoped Role can ever grant
# access to it - this is the one genuinely unavoidable ClusterRole in this
# project. `helm upgrade --install` GETs the target Namespace object as part
# of its normal logic regardless of --create-namespace, and that call was
# failing without this. Kept as narrow as a ClusterRole can be: resourceNames
# restricts it to exactly "devops-app", get only - not "read all namespaces".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cd-deploy-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["devops-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cd-deploy-namespace-read
subjects:
  - kind: ServiceAccount
    name: cd-deploy-sa
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: cd-deploy-namespace-read
  apiGroup: rbac.authorization.k8s.io
