# RBAC for the CD agent Pod. The ServiceAccount lives in the jenkins namespace
# (where CD agent Pods are scheduled), bound via a cross-namespace RoleBinding to
# a Role that grants access only in devops-app - a normal, supported RBAC pattern.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd-deploy-sa
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cd-deploy
  namespace: devops-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # delete, in addition to the others: Helm stores release history as Secrets
    # in this namespace and prunes old ones past its default history limit (10) -
    # this cluster hit revision 10 during evidence capture and deploys failed with
    # "cannot delete resource secrets" until this was added.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # ServiceMonitor (Assignment 5, helm/devops-app/templates/servicemonitors.yaml) -
  # `helm upgrade` GETs every resource the chart declares before deciding
  # create vs. patch, so this is needed even though upgrades only ever patch it.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cd-deploy
  namespace: devops-app
subjects:
  - kind: ServiceAccount
    name: cd-deploy-sa
    namespace: jenkins
roleRef:
  kind: Role
  name: cd-deploy
  apiGroup: rbac.authorization.k8s.io
---
# Namespace is cluster-scoped, so no namespace-scoped Role can grant access to
# it - the one unavoidable ClusterRole in this project. `helm upgrade --install`
# GETs the target Namespace regardless of --create-namespace. Kept as narrow as
# possible: resourceNames restricts it to exactly "devops-app", get only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cd-deploy-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["devops-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cd-deploy-namespace-read
subjects:
  - kind: ServiceAccount
    name: cd-deploy-sa
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: cd-deploy-namespace-read
  apiGroup: rbac.authorization.k8s.io
