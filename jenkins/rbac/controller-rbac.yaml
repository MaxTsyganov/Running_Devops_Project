# RBAC for the Jenkins controller: scoped to the jenkins namespace only,
# limited to what's needed to launch/manage ephemeral agent Pods. No
# cluster-admin, no access to devops-app resources.
#
# No ServiceAccount here on purpose - the Helm chart already creates and owns
# "jenkins-controller" (controller.serviceAccount.create=true); recreating it
# here would hit a Helm ownership conflict. rbac.create=false in
# jenkins/values.yaml disables the chart's own default Role/RoleBinding so this
# one is the only one in effect.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-controller
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "delete", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    # In-namespace only. The Kubernetes Credentials Provider plugin reads Secrets
    # here for credential injection and watches them to pick up changes live.
    # Missing "watch" doesn't break reads, but logs a continuous stream of
    # "403 Forbidden ... watch=true" retry errors.
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # The chart's config-reload-init sidecar reads ConfigMaps in-namespace
    # to load JCasC config onto the shared volume.
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-controller
  namespace: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins-controller
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-controller
  apiGroup: rbac.authorization.k8s.io
