    - "ssh-credentials:372.va_250881b_08cd"
    - "structs:362.va_b_695ef4fdf9"
    # timestamper: top-level - timestamps() in every Jenkinsfile's options{}.
    - "timestamper:1.30"
    - "token-macro:477.vd4f0dc3cb_cf1"
    - "variant:70.va_d9f17f859e0"
    - "woodstox-core-api:7.2.2-10.vcb_629759b_2c2"
    # workflow-aggregator: top-level - Declarative Pipeline itself.
    - "workflow-aggregator:608.v67378e9d3db_1"
    - "workflow-api:1413.v2ff1a_5e720fa_"
    - "workflow-basic-steps:1098.v808b_fd7f8cf4"
    - "workflow-cps:4370.v49a_6937566b_6"
    - "workflow-durable-task-step:1479.v56e587f413a_7"
    - "workflow-job:1571.1580.v18e46842c125"
    - "workflow-multibranch:841.vec5b_9e1806ec"
    - "workflow-scm-step:466.va_d69e602552b_"
    - "workflow-step-api:724.v538c2362b_dfb_"
    - "workflow-support:1015.v785e5a_b_b_8b_22"
    # ws-cleanup: top-level - cleanWs() in every Jenkinsfile's post{always{}}.
    - "ws-cleanup:0.49"

  serviceType: ClusterIP # not exposed publicly - reach it via port-forward for now

persistence:
  enabled: true
  storageClass: "ebs-gp3"
  size: 8Gi

# Dynamic agents are defined above as JCasC Kubernetes cloud pod templates,
# not the chart's own simplified default-agent mechanism.
agent:
  enabled: false

rbac:
  create: false # own Role/RoleBinding supplied instead (jenkins/rbac/controller-rbac.yaml)

# serviceAccount is a top-level key in this chart, not nested under controller -
# an earlier attempt nested it and the override was silently ignored, leaving
# the pod on the chart's autogenerated SA name.
serviceAccount:
  create: true
  name: jenkins-controller
