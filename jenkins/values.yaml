# Values for the official Jenkins Helm chart (jenkinsci/jenkins).
# Every version below was checked against the current release before being
# pinned here (Docker Hub / plugins.jenkins.io / GitHub releases APIs) -
# not guessed. This project has been burned by guessed tags before.

controller:
  image:
    repository: "jenkins/jenkins"
    tag: "2.541.3-lts-jdk17"

  # Controller never runs builds itself - only ephemeral agent Pods do.
  numExecutors: 0

  JCasC:
    defaultConfig: true
    configScripts:
      main: |
        jenkins:
          systemMessage: "DevOps on AWS - Assignment 4 (Jenkins CI/CD). Configured entirely as code (JCasC) - no manual UI setup."
          # numExecutors is NOT set here - defaultConfig=true already generates
          # it from controller.numExecutors above. Setting it in both places
          # trips JCasC's ErrorOnConflictMergeStrategy (two sources defining
          # the same key is treated as a hard error, not a silent override).
          clouds:
            # Named "devops-agents", not "kubernetes": the Helm chart's own
            # defaultConfig auto-injects a second cloud already named
            # "kubernetes" (empty, no templates, serverUrl without ".svc").
            # Two clouds sharing a name made the scheduler resolve the
            # chart's empty one first and fall back to a bare jnlp-only pod,
            # silently ignoring the ci-agent/cd-agent templates below.
            # Confirmed via the CasC "export" endpoint - the only way this
            # was actually visible.
            - kubernetes:
                name: "devops-agents"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                podRetention: "never"
                # Neither template below sets idleMinutes - one used to, on
                # both. idleMinutes keeps a just-finished pod alive and idle
                # for reuse instead of deleting it immediately, which
                # directly contradicts podRetention: never above and was the
                # real cause of a live capacity problem: on this 3-node
                # cluster, back-to-back builds left 5-minutes'-worth of idle,
                # already-finished agent Pods holding onto CPU/memory that a
                # new build's Pods then couldn't schedule into (confirmed
                # live - see evidence/06-bonus-features/15-jcasc-recovery-
                # drill-proof.txt). Removed rather than shortened: this
                # cluster's real constraint is scheduling headroom, not
                # agent cold-start time, so the reuse optimization isn't
                # worth the capacity risk here.
                templates:
                  - name: "ci-agent"
                    label: "ci-agent"
                    namespace: "jenkins"
                    serviceAccount: "ci-build-sa"
                    containers:
                      # Lint/test tooling - same base image the app's own
                      # Dockerfiles use, so results reflect the real runtime.
                      # Sized against a t3.small node's real headroom (~900Mi
                      # free with the app + Jenkins controller already
                      # resident): the original 512Mi/1Gi + 1Gi/2Gi made this
                      # pod unschedulable on any node, confirmed via
                      # `kubectl describe nodes`. Kept small even after
                      # moving to t3.medium - these are small builds
                      # (python-slim/nginx-alpine based), so lower requests
                      # are realistic, and it leaves more of the extra
                      # headroom free for CI/CD agent bursts.
                      - name: "python"
                        image: "python:3.11-slim"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "150m"
                        resourceRequestMemory: "200Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.24.0-debug"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "400Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "800Mi"
                      # Scans the images Kaniko just pushed, straight from ECR
                      # via ci-build-sa's IRSA (needs the pull actions added
                      # alongside the push ones in terraform/iam.tf - Kaniko
                      # only ever needed to push, scanning is the first thing
                      # in this pipeline that reads an image back).
                      - name: "trivy"
                        image: "aquasec/trivy:0.74.0"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "300Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "700Mi"
                  - name: "cd-agent"
                    label: "cd-agent"
                    namespace: "jenkins"
                    serviceAccount: "cd-deploy-sa"
                    containers:
                      - name: "deploy"
                        image: "dtzar/helm-kubectl:3.16"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "1Gi"
        # Shared Library (jenkins/shared-library/vars/) - the same repo as
        # everything else here, not a separate library repo: one less thing
        # to keep in sync. `libraryPath` points the retriever at the
        # subdirectory instead of expecting vars/ at the repo root -
        # confirmed live against pipeline-groovy-lib 798.v5cc688825312, see
        # evidence/06-bonus-features/12-shared-library-live-resolution.txt.
        unclassified:
          globalLibraries:
            libraries:
              - name: "devops-shared-lib"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    libraryPath: "jenkins/shared-library"
                    scm:
                      git:
                        remote: "https://github.com/MaxTsyganov/Running_Devops_Project.git"

  # Job creation deliberately does not happen here. An earlier attempt
  # bootstrapped a seed job through JCasC's own jobs: section, which runs
  # during Jenkins' startup - a syntax slip in that script crashed the
  # whole controller boot, since job creation and core startup shared the
  # same failure path. jenkins/jobs/create-jobs.sh creates
  # ci-application/cd-application afterward instead, via Jenkins' REST API
  # against an already-running controller - a bug there now fails just
  # that script, not the controller.

  # Plugin names only, no individual version pins. An earlier attempt
  # pinned each plugin to whatever version plugins.jenkins.io reported at
  # the time - those versions turned out mutually incompatible (a
  # snakeyaml/credentials ClassNotFoundException killed the controller on
  # boot), because each plugin's dependency graph was checked in isolation,
  # not as a set. Reproducibility instead comes from the pinned Jenkins
  # core image tag above (controller.image.tag): for the same core
  # version, the plugin installer resolves the same compatible set every
  # time - that's the installer's job to solve, not ours to hand-solve.
  installPlugins:
    - "kubernetes"
    - "kubernetes-credentials-provider"
    - "workflow-aggregator"
    - "git"
    - "github"
    - "job-dsl"
    - "configuration-as-code"
    - "credentials-binding"
    - "timestamper"
    - "ws-cleanup"
    # pipeline-groovy-lib: listed explicitly rather than assumed bundled
    # inside workflow-aggregator - powers the Shared Library referenced
    # below (jenkins/shared-library/).
    - "pipeline-groovy-lib"
    # generic-webhook-trigger: triggers ci-application-pr on GitHub
    # pull_request events. The existing "github" plugin's push trigger is
    # push-only; this one triggers off any JSON payload field, which is
    # what pr-Jenkinsfile's job config actually needs.
    - "generic-webhook-trigger"

  serviceType: ClusterIP # not exposed publicly - reach it via port-forward for now

persistence:
  enabled: true
  storageClass: "ebs-gp3"
  size: 8Gi

# Dynamic agents are defined above as JCasC Kubernetes cloud pod templates,
# not the chart's own simplified default-agent mechanism.
agent:
  enabled: false

rbac:
  create: false # own Role/RoleBinding supplied instead (jenkins/rbac/controller-rbac.yaml)

# serviceAccount is a top-level key in this chart, not nested under
# controller - confirmed against the chart's default values. An earlier
# attempt nested it, and the override was silently ignored, leaving the
# pod on the chart's autogenerated SA name.
serviceAccount:
  create: true
  name: jenkins-controller
