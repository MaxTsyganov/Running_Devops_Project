# Values for the official Jenkins Helm chart (jenkinsci/jenkins).
# Every version below was checked against the current release before being
# pinned here (Docker Hub / plugins.jenkins.io / GitHub releases APIs) -
# not guessed. This project has been burned by guessed tags before.

controller:
  image:
    repository: "jenkins/jenkins"
    tag: "2.541.3-lts-jdk17"

  # Controller never runs builds itself - only ephemeral agent Pods do.
  numExecutors: 0

  JCasC:
    defaultConfig: true
    configScripts:
      main: |
        jenkins:
          systemMessage: "DevOps on AWS - Assignment 4 (Jenkins CI/CD). Configured entirely as code (JCasC) - no manual UI setup."
          # numExecutors is NOT set here - defaultConfig=true already generates
          # it from controller.numExecutors above. Setting it in both places
          # trips JCasC's ErrorOnConflictMergeStrategy (two sources defining
          # the same key is treated as a hard error, not a silent override).
          clouds:
            # Named "devops-agents", not "kubernetes": the Helm chart's own
            # defaultConfig auto-injects a second cloud already named
            # "kubernetes" (empty, no templates, serverUrl without ".svc").
            # Two clouds sharing a name made the scheduler resolve the
            # chart's empty one first and fall back to a bare jnlp-only pod,
            # silently ignoring the ci-agent/cd-agent templates below.
            # Confirmed via the CasC "export" endpoint - the only way this
            # was actually visible.
            - kubernetes:
                name: "devops-agents"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                podRetention: "never"
                # Neither template below sets idleMinutes - one used to, on
                # both. idleMinutes keeps a just-finished pod alive and idle
                # for reuse instead of deleting it immediately, which
                # directly contradicts podRetention: never above and was the
                # real cause of a live capacity problem: on this 3-node
                # cluster, back-to-back builds left 5-minutes'-worth of idle,
                # already-finished agent Pods holding onto CPU/memory that a
                # new build's Pods then couldn't schedule into (confirmed
                # live - see evidence/06-bonus-features/15-jcasc-recovery-
                # drill-proof.txt). Removed rather than shortened: this
                # cluster's real constraint is scheduling headroom, not
                # agent cold-start time, so the reuse optimization isn't
                # worth the capacity risk here.
                templates:
                  - name: "ci-agent"
                    label: "ci-agent"
                    namespace: "jenkins"
                    serviceAccount: "ci-build-sa"
                    # Pod-level baseline only sets what's safe for every
                    # container in this template, including kaniko below -
                    # runAsNonRoot can't go here (it's enforced across the
                    # whole Pod, and kaniko fails it - see kaniko's own
                    # securityContext for why). Per-container securityContext
                    # additions layer on top via yamlMergeStrategy: merge,
                    # matched by container name against the "containers:"
                    # list above - one raw-YAML fragment per template, not
                    # one per container, since the merge is Pod-scoped.
                    yamlMergeStrategy: merge
                    yaml: |
                      spec:
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: tmp
                            emptyDir: {}
                        containers:
                          - name: python
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # Confirmed live: without this, `pip install` (lintCode.groovy,
                            # runTests.groovy, and the Sign stage's own boto3 install) fails
                            # with "Read-only file system: '/.local'" - pip falls back to a
                            # user install when it can't write the global site-packages, and
                            # under an arbitrary non-root UID with no /etc/passwd entry, an
                            # unset HOME resolves to "/", landing that fallback on the
                            # read-only root instead of the writable tmp volume below.
                            env:
                              - name: HOME
                                value: "/tmp"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                          - name: kaniko
                            # Deliberately NOT runAsNonRoot / readOnlyRootFilesystem /
                            # capability-dropped like the other three containers here.
                            # Kaniko unpacks base-image layers and has to chown/chmod
                            # extracted files to match whatever ownership the Dockerfile
                            # and base image specify (COPY --chown, non-root base images,
                            # etc.) - that's a privileged filesystem operation only root
                            # (or a process holding CAP_CHOWN/CAP_FOWNER) can do. This is
                            # Kaniko's own documented constraint, not an oversight -
                            # https://github.com/GoogleContainerTools/kaniko#security.
                            # allowPrivilegeEscalation/seccomp are still safe to set:
                            # neither one is part of the ownership-preservation mechanism
                            # above. NOT verified live - if a build shows kaniko itself
                            # (not the image being built) needs a capability beyond root's
                            # default set, that'd only show up under an actual build.
                            securityContext:
                              allowPrivilegeEscalation: false
                              seccompProfile:
                                type: RuntimeDefault
                          - name: trivy
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # Trivy's vulnerability-DB cache defaults to a
                            # path under the invoking user's home directory -
                            # not guessable under an arbitrary non-root UID
                            # with no /etc/passwd entry, so pointed at the
                            # same writable tmp volume explicitly instead of
                            # assumed. NOT verified live.
                            env:
                              - name: TRIVY_CACHE_DIR
                                value: "/tmp/trivy-cache"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                    containers:
                      # Lint/test tooling - same base image the app's own
                      # Dockerfiles use, so results reflect the real runtime.
                      # Sized against a t3.small node's real headroom (~900Mi
                      # free with the app + Jenkins controller already
                      # resident): the original 512Mi/1Gi + 1Gi/2Gi made this
                      # pod unschedulable on any node, confirmed via
                      # `kubectl describe nodes`. Kept small even after
                      # moving to t3.medium - these are small builds
                      # (python-slim/nginx-alpine based), so lower requests
                      # are realistic, and it leaves more of the extra
                      # headroom free for CI/CD agent bursts.
                      # Tag kept alongside the digest for human readability
                      # (what a person reads at a glance); the digest after
                      # @ is what the kubelet actually resolves and pulls -
                      # the tag portion is ignored for that purpose. Each
                      # digest below was resolved directly against the
                      # registry (Docker Hub / GCR manifest API) at the time
                      # it was pinned, same "checked, not guessed" standard
                      # as the controller image tag and plugin versions.
                      # Re-pin by re-querying the registry, not by guessing.
                      - name: "python"
                        image: "python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "150m"
                        resourceRequestMemory: "200Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "400Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "800Mi"
                      # Scans the images Kaniko just pushed, straight from ECR
                      # via ci-build-sa's IRSA (needs the pull actions added
                      # alongside the push ones in terraform/iam.tf - Kaniko
                      # only ever needed to push, scanning is the first thing
                      # in this pipeline that reads an image back).
                      - name: "trivy"
                        image: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "300Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "700Mi"
                  - name: "cd-agent"
                    label: "cd-agent"
                    namespace: "jenkins"
                    serviceAccount: "cd-deploy-sa"
                    yamlMergeStrategy: merge
                    yaml: |
                      spec:
                        # runAsNonRoot NOT set Pod-wide - confirmed live it cascades to the
                        # jnlp sidecar every template auto-gets from the Kubernetes plugin,
                        # and jenkins/inbound-agent's image declares USER jenkins (a name, not
                        # a numeric UID), which the kubelet can't statically verify as non-root
                        # - CreateContainerConfigError on jnlp specifically. Same reason
                        # ci-agent's Pod-level securityContext below never sets it either; put
                        # it on the one container that actually needs it instead.
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: tmp
                            emptyDir: {}
                        containers:
                          - name: deploy
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # kubectl/helm both want a writable HOME for
                            # their own cache/config (~/.kube, ~/.cache/helm)
                            # - not guessable under an arbitrary non-root UID
                            # with no /etc/passwd entry, so both pointed at
                            # the same writable tmp volume explicitly.
                            # NOT verified live.
                            env:
                              - name: HOME
                                value: "/tmp"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                    containers:
                      # Same digest-pinning convention as ci-agent's containers above.
                      - name: "deploy"
                        image: "dtzar/helm-kubectl:3.16@sha256:732b9752c447ce91cbd908c15f9f450e2d94cd3cfec47ce1072956df532cb0bf"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "1Gi"
        # Shared Library (jenkins/shared-library/vars/) - the same repo as
        # everything else here, not a separate library repo: one less thing
        # to keep in sync. `libraryPath` points the retriever at the
        # subdirectory instead of expecting vars/ at the repo root -
        # confirmed live against pipeline-groovy-lib 798.v5cc688825312, see
        # evidence/06-bonus-features/12-shared-library-live-resolution.txt.
        unclassified:
          globalLibraries:
            libraries:
              - name: "devops-shared-lib"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    libraryPath: "jenkins/shared-library"
                    scm:
                      git:
                        remote: "https://github.com/MaxTsyganov/Running_Devops_Project.git"

  # Job creation deliberately does not happen here. An earlier attempt
  # bootstrapped a seed job through JCasC's own jobs: section, which runs
  # during Jenkins' startup - a syntax slip in that script crashed the
  # whole controller boot, since job creation and core startup shared the
  # same failure path. jenkins/jobs/create-jobs.sh creates
  # ci-application/cd-application afterward instead, via Jenkins' REST API
  # against an already-running controller - a bug there now fails just
  # that script, not the controller.

  # Every plugin pinned to shortName:version, not bare names - all 85
  # entries (the 12 actually wanted below plus every transitive dependency)
  # captured by jenkins/scripts/lock-plugin-versions.sh against a live
  # controller that had just booted cleanly on this exact set, confirmed by
  # re-running install-jenkins.sh fresh against it afterward - see
  # jenkins/plugins.lock.txt. An earlier attempt pinned only the top-level
  # plugins, each to whatever version plugins.jenkins.io reported
  # independently - those turned out mutually incompatible (a
  # snakeyaml/credentials ClassNotFoundException killed the controller on
  # boot), because each plugin's dependency graph was checked in isolation,
  # not as a set. This is the fix: a full set that's already proven
  # compatible, not individually-guessed versions. Re-generate by re-running
  # that script after any change to the 12 top-level entries below.
  installPlugins:
    - "antisamy-markup-formatter:173.v680e3a_b_69ff3"
    - "apache-httpcomponents-client-4-api:4.5.14-269.vfa_2321039a_83"
    - "asm-api:9.10.1-216.va_9256d3b_844b_"
    - "authentication-tokens:1.144.v5ff4a_5ec5c33"
    - "bootstrap5-api:5.3.8-895.v4d0d8e47fea_d"
    - "bouncycastle-api:2.30.1.84-291.v9f17b_21896e2"
    - "branch-api:2.1280.v0d4e5b_b_460ef"
    - "caffeine-api:3.2.4-208.v7e2da_a_7db_82b_"
    - "checks-api:415.vf022234a_931d"
    - "cloudbees-folder:6.1106.v3a_d9a_6d2465e"
    - "commons-lang3-api:3.20.0-109.ve43756e2d2b_4"
    - "commons-text-api:1.15.0-218.va_61573470393"
    # configuration-as-code: top-level - JCasC itself (jenkins/values.yaml's
    # own configScripts).
    - "configuration-as-code:2117.vc05a_0b_e6b_f4e"
    # credentials-binding: top-level - not currently used by any Jenkinsfile
    # directly (credentials are read via the Kubernetes Credentials Provider
    # instead), kept for withCredentials() availability if a pipeline needs
    # it later.
    - "credentials:1511.v2e3cb_0008ef0"
    - "credentials-binding:728.v902a_273b_8947"
    - "display-url-api:2.217.va_6b_de84cc74b_"
    - "durable-task:686.v80ff80875b_82"
    - "echarts-api:6.0.0-1247.vf3e35a_c1813f"
    - "font-awesome-api:7.2.0-965.ve3840b_696418"
    # generic-webhook-trigger: top-level - triggers ci-application-pr on
    # GitHub pull_request events. The "github" plugin's push trigger is
    # push-only; this one triggers off any JSON payload field, which is
    # what pr-Jenkinsfile's job config actually needs.
    - "generic-webhook-trigger:2.4.2"
    # git: top-level - checkout scm in every Jenkinsfile.
    - "git:5.10.1"
    - "git-client:6.6.1"
    # github: top-level - githubPush() trigger in ci/Jenkinsfile.
    - "github:1.47.0"
    - "github-api:1.330-492.v3941a_032db_2a_"
    - "gson-api:2.14.0-201.v8eefe5515533"
    - "instance-identity:203.v15e81a_1b_7a_38"
    - "ionicons-api:94.vcc3065403257"
    - "jackson-annotations2-api:2.22-19.v10a_a_582ea_26e"
    - "jackson2-api:2.22.2-445.vdc613f1d8012"
    - "jackson3-api:3.2.2-96.v599957900a_1a_"
    - "jakarta-activation-api:2.1.4-1"
    - "jakarta-mail-api:2.1.5-1"
    - "jakarta-xml-bind-api:4.0.9-19.v2b_a_5b_44d9a_1c"
    - "javax-activation-api:1.2.0-8"
    - "jaxb:2.3.9-143.v5979df3304e6"
    # job-dsl: top-level - not currently used by any pipeline directly
    # (jenkins/jobs/create-jobs.sh creates jobs via the REST API instead,
    # not job-dsl's own DSL), kept available for that path if adopted later.
    - "job-dsl:3732.v9a_c49a_61a_313"
    - "joda-time-api:2.14.3-200.v65623733c99f"
    - "jquery3-api:3.7.1-619.vdb_10e002501a_"
    - "json-api:20260814-226.v20f9685d642c"
    - "json-path-api:3.0.0-218.vcd4dd1355de2"
    - "junit:1424.vc64a_edde7777"
    # kubernetes: top-level - the devops-agents Kubernetes cloud itself.
    - "kubernetes:4547.v52f3080db_8cd"
    - "kubernetes-client-api:7.3.1-256.v788a_0b_787114"
    - "kubernetes-credentials:207.v492f58828b_ed"
    # kubernetes-credentials-provider: top-level - what makes git-webhook-secret/
    # slack-webhook-url plain Kubernetes Secrets show up as Jenkins credentials.
    - "kubernetes-credentials-provider:1.315.v92008589c044"
    - "mailer:534.v1b_36f5864073"
    - "matrix-project:905.vcc6831e8760a_"
    - "metrics:4.2.37-494.v06f9a_939d33a_"
    - "mina-sshd-api-common:2.19.0-192.v2b_a_7b_2c1dc71"
    - "mina-sshd-api-core:2.19.0-192.v2b_a_7b_2c1dc71"
    - "okhttp-api:5.3.2-200.vedb_720a_cf1f8"
    - "pipeline-build-step:599.v4b_67ea_11b_152"
    # pipeline-groovy-lib: listed explicitly rather than assumed bundled
    # inside workflow-aggregator - powers the Shared Library referenced
    # below (jenkins/shared-library/).
    - "pipeline-groovy-lib:798.v5cc688825312"
    - "pipeline-input-step:560.v56198a_642157"
    - "pipeline-milestone-step:152.v6e22b_8cfc66c"
    - "pipeline-model-api:2.2293.v6e7193cec599"
    - "pipeline-model-definition:2.2293.v6e7193cec599"
    - "pipeline-model-extensions:2.2293.v6e7193cec599"
    - "pipeline-stage-step:345.va_96187909426"
    - "pipeline-stage-tags-metadata:2.2293.v6e7193cec599"
    - "plain-credentials:199.v9f8e1f741799"
    - "plugin-util-api:6.1192.v30fe6e2837ff"
    - "prism-api:1.30.0-717.vb_f8360844b_53"
    - "resource-disposer:0.25"
    - "scm-api:728.vc30dcf7a_0df5"
    - "script-security:1412.v7737b_3405f86"
    - "snakeyaml-api:2.5-149.v72471e9c6371"
    - "snakeyaml-engine-api:3.1.1-12.v4320c7d6f89c"
    - "ssh-credentials:372.va_250881b_08cd"
    - "structs:362.va_b_695ef4fdf9"
    # timestamper: top-level - timestamps() in every Jenkinsfile's options{}.
    - "timestamper:1.30"
    - "token-macro:477.vd4f0dc3cb_cf1"
    - "variant:70.va_d9f17f859e0"
    - "woodstox-core-api:7.2.2-10.vcb_629759b_2c2"
    # workflow-aggregator: top-level - Declarative Pipeline itself.
    - "workflow-aggregator:608.v67378e9d3db_1"
    - "workflow-api:1413.v2ff1a_5e720fa_"
    - "workflow-basic-steps:1098.v808b_fd7f8cf4"
    - "workflow-cps:4370.v49a_6937566b_6"
    - "workflow-durable-task-step:1479.v56e587f413a_7"
    - "workflow-job:1571.1580.v18e46842c125"
    - "workflow-multibranch:841.vec5b_9e1806ec"
    - "workflow-scm-step:466.va_d69e602552b_"
    - "workflow-step-api:724.v538c2362b_dfb_"
    - "workflow-support:1015.v785e5a_b_b_8b_22"
    # ws-cleanup: top-level - cleanWs() in every Jenkinsfile's post{always{}}.
    - "ws-cleanup:0.49"

  serviceType: ClusterIP # not exposed publicly - reach it via port-forward for now

persistence:
  enabled: true
  storageClass: "ebs-gp3"
  size: 8Gi

# Dynamic agents are defined above as JCasC Kubernetes cloud pod templates,
# not the chart's own simplified default-agent mechanism.
agent:
  enabled: false

rbac:
  create: false # own Role/RoleBinding supplied instead (jenkins/rbac/controller-rbac.yaml)

# serviceAccount is a top-level key in this chart, not nested under
# controller - confirmed against the chart's default values. An earlier
# attempt nested it, and the override was silently ignored, leaving the
# pod on the chart's autogenerated SA name.
serviceAccount:
  create: true
  name: jenkins-controller
