# Values for the official Jenkins Helm chart (jenkinsci/jenkins).
# Every version below was checked against the current release before being
# pinned here (Docker Hub / plugins.jenkins.io / GitHub releases APIs), not guessed.

controller:
  image:
    repository: "jenkins/jenkins"
    tag: "2.541.3-lts-jdk17"

  # Controller never runs builds itself - only ephemeral agent Pods do.
  numExecutors: 0

  JCasC:
    defaultConfig: true
    configScripts:
      main: |
        jenkins:
          systemMessage: "DevOps on AWS - Assignment 4 (Jenkins CI/CD). Configured entirely as code (JCasC) - no manual UI setup."
          # numExecutors is NOT set here - defaultConfig=true already generates it
          # from controller.numExecutors above; setting it in both places trips
          # JCasC's ErrorOnConflictMergeStrategy (a hard error, not a silent override).
          clouds:
            # Named "devops-agents", not "kubernetes": the chart's own defaultConfig
            # auto-injects a second, empty cloud already named "kubernetes". Two
            # clouds sharing a name made the scheduler resolve the chart's empty one
            # first, silently ignoring the ci-agent/cd-agent templates below.
            - kubernetes:
                name: "devops-agents"
                serverUrl: "https://kubernetes.default.svc"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                podRetention: "never"
                # Neither template sets idleMinutes - it used to, on both. idleMinutes
                # keeps a just-finished pod alive for reuse, contradicting podRetention:
                # never above, and caused a real capacity problem: idle finished Pods
                # held CPU/memory that new builds couldn't schedule into on this 3-node
                # cluster (see evidence/06-bonus-features/15-jcasc-recovery-drill-proof.txt).
                templates:
                  - name: "ci-agent"
                    label: "ci-agent"
                    namespace: "jenkins"
                    serviceAccount: "ci-build-sa"
                    # Pod-level baseline only sets what's safe for every container,
                    # including kaniko below - runAsNonRoot can't go here since it's
                    # Pod-wide and kaniko fails it (see kaniko's own securityContext).
                    # Per-container additions layer on via yamlMergeStrategy: merge.
                    yamlMergeStrategy: merge
                    yaml: |
                      spec:
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: tmp
                            emptyDir: {}
                        containers:
                          - name: python
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # Without this, `pip install` fails with "Read-only file system:
                            # '/.local'" - under a non-root UID with no /etc/passwd entry, an
                            # unset HOME resolves to "/", landing pip's fallback user install
                            # on the read-only root instead of the writable tmp volume below.
                            env:
                              - name: HOME
                                value: "/tmp"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                          - name: kaniko
                            # Deliberately NOT runAsNonRoot / readOnlyRootFilesystem /
                            # capability-dropped like the other containers: Kaniko has to
                            # chown/chmod extracted layer files to match Dockerfile/base-image
                            # ownership (COPY --chown, non-root base images), a privileged
                            # operation only root can do. Documented Kaniko constraint, not an
                            # oversight - https://github.com/GoogleContainerTools/kaniko#security.
                            # allowPrivilegeEscalation/seccomp are still safe to set here.
                            securityContext:
                              allowPrivilegeEscalation: false
                              seccompProfile:
                                type: RuntimeDefault
                          - name: trivy
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # Trivy's vulnerability-DB cache defaults to a path under the
                            # invoking user's home directory - not guessable under a UID with
                            # no /etc/passwd entry, so pointed at the writable tmp volume explicitly.
                            env:
                              - name: TRIVY_CACHE_DIR
                                value: "/tmp/trivy-cache"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                    containers:
                      # Lint/test tooling - same base image the app's own Dockerfiles use, so
                      # results reflect the real runtime. Sized against a t3.small node's real
                      # headroom (~900Mi free): the original 512Mi/1Gi + 1Gi/2Gi made this pod
                      # unschedulable, confirmed via `kubectl describe nodes`. Kept small even
                      # after moving to t3.medium, leaving headroom for CI/CD agent bursts.
                      # Tag kept alongside the digest for readability; the digest after @ is
                      # what the kubelet actually pulls, resolved directly against the
                      # registry at pin time. Re-pin by re-querying, not by guessing.
                      - name: "python"
                        image: "python:3.11-slim@sha256:9c900dea9e8fb7e16277c179b555cc72d29a352dbc33cff48ad5a0412fd5bfc7"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "150m"
                        resourceRequestMemory: "200Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "400Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "800Mi"
                      # Scans the images Kaniko just pushed, straight from ECR via
                      # ci-build-sa's IRSA (needs the pull actions added alongside push in
                      # terraform/iam.tf - scanning is the first step here that reads an image back).
                      - name: "trivy"
                        image: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "300Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "700Mi"
                  - name: "cd-agent"
                    label: "cd-agent"
                    namespace: "jenkins"
                    serviceAccount: "cd-deploy-sa"
                    yamlMergeStrategy: merge
                    yaml: |
                      spec:
                        # runAsNonRoot NOT set Pod-wide - it cascades to the jnlp sidecar every
                        # template auto-gets, and jenkins/inbound-agent's image declares USER
                        # jenkins (a name, not numeric UID), which the kubelet can't verify as
                        # non-root - CreateContainerConfigError on jnlp. Same reason ci-agent's
                        # Pod-level securityContext never sets it either; put it on the one
                        # container that needs it instead.
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        volumes:
                          - name: tmp
                            emptyDir: {}
                        containers:
                          - name: deploy
                            securityContext:
                              runAsNonRoot: true
                              runAsUser: 1000
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                drop: ["ALL"]
                            # kubectl/helm both want a writable HOME for cache/config
                            # (~/.kube, ~/.cache/helm) - not guessable under a UID with no
                            # /etc/passwd entry, so pointed at the writable tmp volume explicitly.
                            env:
                              - name: HOME
                                value: "/tmp"
                            volumeMounts:
                              - name: tmp
                                mountPath: /tmp
                    containers:
                      # Same digest-pinning convention as ci-agent's containers above.
                      - name: "deploy"
                        image: "dtzar/helm-kubectl:3.16@sha256:732b9752c447ce91cbd908c15f9f450e2d94cd3cfec47ce1072956df532cb0bf"
                        command: "sleep"
                        args: "99d"
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "1Gi"
        # Shared Library (jenkins/shared-library/vars/) - same repo as everything
        # else here, not a separate library repo, one less thing to keep in sync.
        # `libraryPath` points the retriever at the subdirectory instead of
        # expecting vars/ at the repo root (see
        # evidence/06-bonus-features/12-shared-library-live-resolution.txt).
        unclassified:
          globalLibraries:
            libraries:
              - name: "devops-shared-lib"
                defaultVersion: "main"
                retriever:
                  modernSCM:
                    libraryPath: "jenkins/shared-library"
                    scm:
                      git:
                        remote: "https://github.com/MaxTsyganov/Running_Devops_Project.git"

  # Job creation deliberately does not happen here. An earlier attempt bootstrapped
  # a seed job through JCasC's own jobs: section (runs during startup), and a
  # syntax slip there crashed the whole controller boot. jenkins/jobs/create-jobs.sh
  # creates the jobs afterward instead, via REST API against an already-running
  # controller - a bug there now fails just that script, not the controller.

  # Every plugin pinned to shortName:version, not bare names - all 85 entries (12
  # actually wanted plus every transitive dependency) captured by
  # jenkins/scripts/lock-plugin-versions.sh against a live controller that had
  # just booted cleanly on this exact set (see jenkins/plugins.lock.txt). An
  # earlier attempt pinned only top-level plugins, each to whatever version
  # plugins.jenkins.io reported independently - those were mutually incompatible
  # (a snakeyaml/credentials ClassNotFoundException killed the controller on
  # boot) since each dependency graph was checked in isolation, not as a set.
  # Re-generate by re-running that script after any change to the top-level entries.
  installPlugins:
    - "antisamy-markup-formatter:173.v680e3a_b_69ff3"
    - "apache-httpcomponents-client-4-api:4.5.14-269.vfa_2321039a_83"
    - "asm-api:9.10.1-216.va_9256d3b_844b_"
    - "authentication-tokens:1.144.v5ff4a_5ec5c33"
    - "bootstrap5-api:5.3.8-895.v4d0d8e47fea_d"
    - "bouncycastle-api:2.30.1.84-291.v9f17b_21896e2"
    - "branch-api:2.1280.v0d4e5b_b_460ef"
    - "caffeine-api:3.2.4-208.v7e2da_a_7db_82b_"
    - "checks-api:415.vf022234a_931d"
    - "cloudbees-folder:6.1106.v3a_d9a_6d2465e"
    - "commons-lang3-api:3.20.0-109.ve43756e2d2b_4"
    - "commons-text-api:1.15.0-218.va_61573470393"
    # configuration-as-code: top-level - JCasC itself (jenkins/values.yaml's
    # own configScripts).
    - "configuration-as-code:2117.vc05a_0b_e6b_f4e"
    # credentials-binding: top-level - not currently used by any Jenkinsfile
    # directly (credentials are read via the Kubernetes Credentials Provider
    # instead), kept for withCredentials() availability if a pipeline needs
    # it later.
    - "credentials:1511.v2e3cb_0008ef0"
    - "credentials-binding:728.v902a_273b_8947"
    - "display-url-api:2.217.va_6b_de84cc74b_"
    - "durable-task:686.v80ff80875b_82"
    - "echarts-api:6.0.0-1247.vf3e35a_c1813f"
    - "font-awesome-api:7.2.0-965.ve3840b_696418"
    # generic-webhook-trigger: top-level - triggers ci-application-pr on
    # GitHub pull_request events. The "github" plugin's push trigger is
    # push-only; this one triggers off any JSON payload field, which is
    # what pr-Jenkinsfile's job config actually needs.
    - "generic-webhook-trigger:2.4.2"
    # git: top-level - checkout scm in every Jenkinsfile.
    - "git:5.10.1"
    - "git-client:6.6.1"
    # github: top-level - githubPush() trigger in ci/Jenkinsfile.
    - "github:1.47.0"
    - "github-api:1.330-492.v3941a_032db_2a_"
    - "gson-api:2.14.0-201.v8eefe5515533"
    - "instance-identity:203.v15e81a_1b_7a_38"
    - "ionicons-api:94.vcc3065403257"
    - "jackson-annotations2-api:2.22-19.v10a_a_582ea_26e"
    - "jackson2-api:2.22.2-445.vdc613f1d8012"
    - "jackson3-api:3.2.2-96.v599957900a_1a_"
    - "jakarta-activation-api:2.1.4-1"
    - "jakarta-mail-api:2.1.5-1"
    - "jakarta-xml-bind-api:4.0.9-19.v2b_a_5b_44d9a_1c"
    - "javax-activation-api:1.2.0-8"
    - "jaxb:2.3.9-143.v5979df3304e6"
    # job-dsl: top-level - not currently used by any pipeline directly
    # (jenkins/jobs/create-jobs.sh creates jobs via the REST API instead,
    # not job-dsl's own DSL), kept available for that path if adopted later.
    - "job-dsl:3732.v9a_c49a_61a_313"
    - "joda-time-api:2.14.3-200.v65623733c99f"
    - "jquery3-api:3.7.1-619.vdb_10e002501a_"
    - "json-api:20260814-226.v20f9685d642c"
    - "json-path-api:3.0.0-218.vcd4dd1355de2"
    - "junit:1424.vc64a_edde7777"
    # kubernetes: top-level - the devops-agents Kubernetes cloud itself.
    - "kubernetes:4547.v52f3080db_8cd"
    - "kubernetes-client-api:7.3.1-256.v788a_0b_787114"
    - "kubernetes-credentials:207.v492f58828b_ed"
    # kubernetes-credentials-provider: top-level - what makes git-webhook-secret/
    # slack-webhook-url plain Kubernetes Secrets show up as Jenkins credentials.
    - "kubernetes-credentials-provider:1.315.v92008589c044"
    - "mailer:534.v1b_36f5864073"
    - "matrix-project:905.vcc6831e8760a_"
    - "metrics:4.2.37-494.v06f9a_939d33a_"
    - "mina-sshd-api-common:2.19.0-192.v2b_a_7b_2c1dc71"
    - "mina-sshd-api-core:2.19.0-192.v2b_a_7b_2c1dc71"
    - "okhttp-api:5.3.2-200.vedb_720a_cf1f8"
    - "pipeline-build-step:599.v4b_67ea_11b_152"
    # pipeline-graph-analysis, pipeline-rest-api: transitive deps pulled in
    # by prometheus below, not requested directly.
    - "pipeline-graph-analysis:254.v0f63a_a_447dca_"
    # pipeline-groovy-lib: listed explicitly rather than assumed bundled
    # inside workflow-aggregator - powers the Shared Library referenced
    # below (jenkins/shared-library/).
    - "pipeline-groovy-lib:798.v5cc688825312"
    - "pipeline-input-step:560.v56198a_642157"
    - "pipeline-milestone-step:152.v6e22b_8cfc66c"
    - "pipeline-model-api:2.2293.v6e7193cec599"
    - "pipeline-model-definition:2.2293.v6e7193cec599"
