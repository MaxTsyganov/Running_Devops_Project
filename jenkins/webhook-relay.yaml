# Gets GitHub push events to Jenkins without ever opening an inbound port on
# Jenkins itself. The assignment requires both a real webhook trigger (not
# polling) AND that the Jenkins UI/endpoints stay off the public internet -
# a relay satisfies both at once: this pod holds an *outbound* connection to
# a public smee.io channel and forwards whatever GitHub POSTs there straight
# to Jenkins' internal ClusterIP service. Jenkins never gets an inbound port,
# public IP, Ingress, or LoadBalancer of its own.
#
# Not using the official smee-client npm package. Every version checked
# (2.0.4 through current 5.0.0) has a real bug: its forwarding code does
# `mode: data["sec-fetch-mode"]`, blindly reusing whatever incoming header
# value GitHub's delivery included as the `mode` option on its own outgoing
# fetch call. A real GitHub push includes that header (via GitHub's
# Hookshot agent / smee.io's Azure App Service front-end); a synthetic
# test request doesn't - which is why manual curl/wget tests against this
# endpoint succeeded while real GitHub deliveries got HTTP 405 from
# Jenkins every time. Root-caused by reading smee-client's source and
# confirmed with webhook.site captures of the real payload/headers. The
# replacement below has been proven against a real GitHub push -
# ci-application started on its own, no manual Build Now.
#
# The script below talks the same SSE protocol smee.io uses (a chunked
# text/event-stream GET) directly via Node's stable fetch/streams - no
# experimental flags, no extra dependencies - and forwards only a deliberate
# allowlist of the actual GitHub headers Jenkins' github-webhook endpoint
# needs, instead of blindly copying every incoming header/metadata key.
#
# SMEE_URL comes from a ConfigMap that configure-jenkins.sh creates (a fresh
# https://smee.io/<channel> generated once via `curl -sI https://smee.io/new`
# and persisted, not committed - re-running configure.sh reuses the existing
# channel instead of minting a new one each time).
#
# Signature verification lives here, not in Jenkins' own GitHub plugin: this
# relay is the one component with an outbound connection to the public
# internet, so it's the actual trust boundary between a real GitHub delivery
# and anything Jenkins ever sees - verifying here means neither Jenkins
# endpoint has to trust an unauthenticated POST from inside the cluster
# network, regardless of what the GitHub plugin's own System Config does or
# doesn't check.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-relay-script
  namespace: jenkins
data:
  relay.js: |
    const crypto = require("node:crypto");

    const smeeUrl = process.env.SMEE_URL;
    const target = process.env.TARGET_URL;
    // Separate target for pull_request events: the "github" plugin's push
    // trigger (TARGET_URL, /github-webhook/) only ever fires on push -
    // ci-application-pr is triggered by the generic-webhook-trigger plugin
    // instead, which listens on its own endpoint. push/ping keep going to
    // TARGET_URL exactly as before; only pull_request gets routed here.
    // PR_WEBHOOK_TOKEN is appended at runtime (never baked into this
    // ConfigMap or committed to git) - generated fresh by
    // configure-jenkins.sh and read from git-webhook-secret.
    const targetPrBase = process.env.TARGET_URL_PR;
    const prToken = process.env.PR_WEBHOOK_TOKEN;
    const targetPr = (targetPrBase && prToken) ? `${targetPrBase}?token=${prToken}` : targetPrBase;

    // HMAC secret GitHub signs every real delivery with (configure-jenkins.sh
    // generates it, stored in git-webhook-secret). VERIFY_SIGNATURES defaults
    // to enforcing this and is deliberately a plain env var (not read from a
    // Secret) so it's a one-line manifest edit to flip off, not a credential
    // to rotate, if a real GitHub delivery is ever seen failing verification
    // that a manual curl/wget test against this endpoint wouldn't catch
    // (smee.io re-encodes the original payload as JSON before this relay
    // ever sees it - verified against the actual byte layout smee.io hands
    // back over its SSE stream, but a mismatch here means "reject a real
    // delivery," not "forward a forged one," so fail loud instead of silent).
    const hmacSecret = process.env.WEBHOOK_HMAC_SECRET;
    const verifySignatures = process.env.VERIFY_SIGNATURES !== "false";

    function signatureValid(body, signatureHeader) {
      if (!hmacSecret || !signatureHeader || !signatureHeader.startsWith("sha256=")) {
        return false;
      }
      const expected = "sha256=" + crypto.createHmac("sha256", hmacSecret).update(body).digest("hex");
      const a = Buffer.from(expected);
      const b = Buffer.from(signatureHeader);
      return a.length === b.length && crypto.timingSafeEqual(a, b);
    }

    async function forward(data) {
      // smee.io sends housekeeping messages (e.g. an empty {} on connect)
      // through the same channel alongside real GitHub deliveries - only
      // real webhook payloads have an event type and a body.
      const event = data["x-github-event"];
      if (!event || !data.body) {
        return;
      }
      const dest = (event === "pull_request" && targetPr) ? targetPr : target;
      const body = JSON.stringify(data.body);
      const signatureHeader = data["x-hub-signature-256"] || "";
      if (verifySignatures) {
        if (!signatureValid(body, signatureHeader)) {
          console.error(`Dropped ${event} delivery - signature did not verify, not forwarding to Jenkins.`);
          return;
        }
      } else {
        console.log(`VERIFY_SIGNATURES=false - forwarding ${event} unverified.`);
      }
      try {
        const res = await fetch(dest, {
          method: "POST",
          body,
          headers: {
            "content-type": "application/json",
            "x-github-event": event || "",
            "x-github-delivery": data["x-github-delivery"] || "",
            "x-hub-signature-256": signatureHeader,
            "x-hub-signature": data["x-hub-signature"] || "",
          },
        });
        console.log(`POST ${dest} - ${res.status}`);
      } catch (err) {
        console.error("Forward failed:", err);
      }
    }

    async function connect() {
      console.log(`Connecting to ${smeeUrl}...`);
      const res = await fetch(smeeUrl, { headers: { accept: "text/event-stream" } });
      console.log(`Connected. Forwarding to ${target}`);

      let buffer = "";
      for await (const chunk of res.body) {
        buffer += Buffer.from(chunk).toString("utf8");
        let idx;
        while ((idx = buffer.indexOf("\n\n")) !== -1) {
          const rawEvent = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const dataLines = rawEvent
            .split("\n")
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim());
          if (dataLines.length === 0) continue;
          try {
            const data = JSON.parse(dataLines.join("\n"));
            await forward(data);
          } catch (err) {
            console.error("Failed to parse event:", err);
          }
        }
      }
      console.log("Connection closed, reconnecting in 3s...");
      setTimeout(() => connect().catch(fatal), 3000);
    }

    function fatal(err) {
      console.error("Fatal error, reconnecting in 3s:", err);
      setTimeout(() => connect().catch(fatal), 3000);
    }

    connect().catch(fatal);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-relay
  namespace: jenkins
  labels:
    app: webhook-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-relay
  template:
    metadata:
      labels:
        app: webhook-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: relay
          image: node:22.22-alpine3.24
          command: ["node", "/relay/relay.js"]
          env:
            - name: SMEE_URL
              valueFrom:
                configMapKeyRef:
                  name: smee-channel
                  key: url
            - name: TARGET_URL
              value: "http://jenkins.jenkins.svc.cluster.local:8080/github-webhook/"
            # Base URL only - relay.js appends ?token=$PR_WEBHOOK_TOKEN at
            # runtime. jenkins/jobs/create-jobs.sh injects the same generated
            # token into ci-application-pr-config.xml's <token> when it
            # creates that job, so the two stay in sync without either one
            # being a committed literal.
            - name: TARGET_URL_PR
              value: "http://jenkins.jenkins.svc.cluster.local:8080/generic-webhook-trigger/invoke"
            - name: WEBHOOK_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: git-webhook-secret
                  key: text
            - name: PR_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-webhook-secret
                  key: pr-token
            # Plain value, not a Secret ref - a one-line manifest edit to
            # flip off if a real GitHub delivery is ever seen failing
            # verification (see relay.js's own comment on why that's a
            # "reject a real one" risk here, not a "forward a forged one"
            # risk), not something that needs rotating like the two above.
            - name: VERIFY_SIGNATURES
              value: "true"
          volumeMounts:
            - name: script
              mountPath: /relay
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: webhook-relay-script
