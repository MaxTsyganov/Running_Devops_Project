name: CI

# Validates the code on every push/PR - no AWS credentials involved, nothing
# here deploys anything. Deployment stays a deliberate, manual `make
# k8s-deploy` run: wiring cloud credentials into Actions on a public repo is
# a different risk profile than read-only validation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"
      - run: helm lint helm/devops-app --strict
      - run: |
          helm template devops-app ./helm/devops-app \
            --namespace devops-app \
            --set image.registry=123456789012.dkr.ecr.us-east-1.amazonaws.com \
            > /dev/null

  images:
    name: Build and scan images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-${{ matrix.service }}:ci ./${{ matrix.service }}

      # Full report (HIGH+CRITICAL, including unfixed) - non-blocking, kept
      # purely for visibility. Saved as a build artifact so scan results are
      # actually retrievable instead of only living in the workflow log.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-${{ matrix.service }}.json
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json

      # The actual gate: fails the build on fixable CRITICAL findings.
      # --ignore-unfixed skips CVEs with no available patch; accepted-risk
      # exceptions go in .trivyignore with a documented reason, never a
      # blanket exit-code override.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-${{ matrix.service }}:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  config:
    name: Scan IaC for misconfigurations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Unlike the image scan above, this one is blocking: every finding
      # Trivy currently knows about here is already fixed or suppressed with
      # a documented reason (terraform/data.tf, terraform/network.tf) - a
      # failure here means something genuinely new, not silent tolerance.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: helm/devops-app
          severity: HIGH,CRITICAL
