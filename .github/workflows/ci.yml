name: CI

# Validates the code on every push/PR - no AWS credentials involved, nothing
# here ever deploys anything. Actual deployment stays a deliberate, manual
# `make k8s-deploy` run: this is a public repo, and wiring real cloud
# credentials into Actions secrets so every push could touch live infra is a
# different risk profile than read-only validation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"
      - run: helm lint helm/devops-app --strict
      - run: |
          helm template devops-app ./helm/devops-app \
            --namespace devops-app \
            --set image.registry=123456789012.dkr.ecr.us-east-1.amazonaws.com \
            > /dev/null

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-${{ matrix.service }}:ci ./${{ matrix.service }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

  config:
    name: Scan IaC for misconfigurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unlike the image scan above, this one is blocking (no exit-code
      # override): every finding Trivy currently knows about in this repo
      # has already been fixed or explicitly suppressed with a documented
      # reason (see terraform/data.tf, terraform/network.tf). A clean run
      # should always pass - if this fails, something genuinely new needs
      # looking at, not silent tolerance.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: helm/devops-app
          severity: HIGH,CRITICAL
