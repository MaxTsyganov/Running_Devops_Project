# NetworkPolicy objects for the observability namespace. Applied by
# observability/scripts/install-observability.sh after the stack is up
# (labels below were checked against real running Pods via `kubectl get
# pods --show-labels` and `helm template`, not assumed from chart docs) -
# same structure and same enforcement caveats as jenkins/networkpolicies.yaml.
#
# Enforcement prerequisite: VPC CNI NetworkPolicy support (setup.sh step
# [4/11]) - already on cluster-wide, nothing extra needed here.
#
# Two honest limitations, both inherited from the same AWS VPC CNI
# behavior already documented in jenkins/networkpolicies.yaml:
#
# 1. node-exporter and kubelet/cAdvisor are reached at the NODE's own IP
#    (node-exporter runs hostNetwork: true; kubelet is the node's own
#    process) - standard NetworkPolicy does not meaningfully constrain
#    hostNetwork traffic on this CNI. The egress rules below are still
#    written as tightly as possible (this cluster's real private-subnet
#    CIDRs, not 0.0.0.0/0), but are a statement of intent, not a real
#    enforcement boundary - same honesty already applied to the Jenkins
#    agent policy's own hostNetwork-adjacent traffic.
#
# 2. The prometheus-operator's validating/mutating admission webhooks
#    (observability-admission) are called INTO its Pod by the EKS control
#    plane - a source no podSelector/namespaceSelector can match, since
#    it's not a cluster Pod. No ingress rule is written for it below.
#    Confirmed live this is safe: `kubectl get validatingwebhookconfigurations
#    observability-admission -o yaml` shows `failurePolicy: Ignore` (the
#    chart's own default) - if this traffic were ever blocked, Kubernetes
#    skips the webhook and proceeds rather than rejecting the request, so
#    `kubectl apply` of a PrometheusRule/AlertmanagerConfig never hangs or
#    fails over it. CI's own promtool/kubeconform validation (see
#    jenkins/ci/Jenkinsfile) is the real gate for those objects' shape
#    anyway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny-all
  namespace: observability
spec:
  podSelector: {} # every pod in this namespace
  policyTypes:
    - Ingress
    - Egress
  # No rules under either key = deny all by default. Everything below is an
  # additive allow on top of this baseline.

---
# Prometheus: scrapes everything (devops-app, jenkins, its own namespace,
# and cluster-level kube-system targets), sends alerts to Alertmanager, and
# accepts queries from Grafana plus (per the CD pipeline's new Monitoring
# Gate, jenkins/cd/Jenkinsfile) cd-agent Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
          podSelector:
            matchLabels:
              jenkins: slave
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 9113
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: worker
      ports:
        - protocol: TCP
          port: 9100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
          podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 8080
    - to:
        # One combined rule for every same-namespace scrape target sharing
        # this direction - each port below only matters to whichever of
        # these actually listens on it (grafana:3000, operator's own
        # metrics:10250, kube-state-metrics:8080, alertmanager:8080/9093),
        # the extra reachability on ports the others don't listen on is
        # harmless. Caught live: this rule originally covered only
        # kube-state-metrics/alertmanager - Prometheus's own EGRESS to
        # Grafana and the operator was missing entirely, which is a
        # different, equally necessary half of the pairing from the
        # ingress rules already written on grafana-policy/
        # prometheus-operator-policy (NetworkPolicy requires both the
        # source's egress AND the destination's ingress to independently
        # allow traffic - having only one side denies it just as
        # completely as having neither).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app: kube-prometheus-stack-operator
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 10250
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 9153 # coredns's own /metrics, not the DNS port itself
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # this cluster's Service CIDR - kubernetes.default.svc for API-based service discovery, same rule/reasoning as jenkins-controller-policy's own
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.2.0/24 # this cluster's real private-subnet CIDRs (terraform/network.tf) - node-exporter/kubelet/kube-proxy, all hostNetwork - see header comment #1
        - ipBlock:
            cidr: 10.0.3.0/24
      ports:
        - protocol: TCP
          port: 9100 # node-exporter
        - protocol: TCP
          port: 10250 # kubelet + cAdvisor
        - protocol: TCP
          port: 10249 # kube-proxy
        # Port 443 here too - caught live: the chart's own "apiserver" job
        # (observability-apiserver ServiceMonitor) scrapes the API server's
        # real control-plane ENI IPs directly (Prometheus's "endpoints" role
        # service discovery resolves straight to backend IPs, bypassing the
        # kubernetes.default.svc ClusterIP entirely for the actual scrape
        # connection) - and those ENI IPs land in this cluster's private
        # subnets, same as node/kubelet IPs, not in the 172.20.0.0/16
        # Service CIDR the rule above covers. Confirmed live: this job was
        # the one real target still down after every other fix here.
        - protocol: TCP
          port: 443

---
# Alertmanager: accepts alerts from Prometheus (and optionally queries from
# Grafana's Alertmanager datasource) on 9093, plus its own separate /metrics
# on 8080 (a second port on the same Service - caught live: the chart's own
# observability-alertmanager ServiceMonitor has two endpoints, 9093 for the
# API and 8080 for metrics, and only allowing 9093 left the metrics scrape
# down). Egresses to Slack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # Slack's webhook endpoint - public, can't be scoped by IP, same reasoning as jenkins-agent-policy's own GitHub/ECR/KMS/PyPI rule
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Grafana: queries Prometheus and Alertmanager as datasources; its sidecar
# (dashboard/datasource provisioning) watches ConfigMaps cluster-wide via
# the Kubernetes API. Reachable itself only via kubectl port-forward - same
# posture as Jenkins/Prometheus/Alertmanager, no *inbound-user-traffic*
# ingress rule needed for that (see jenkins-controller-policy precedent:
# port-forward already works today with no explicit ingress-from-apiserver
# rule). Does still need one real ingress rule though - Prometheus scrapes
# Grafana's own /metrics (the observability-grafana ServiceMonitor) -
# caught live, this was the one Ingress rule missing from this policy
# entirely (it only declared Egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # Kubernetes API - the dashboard/datasource sidecar's ConfigMap watch
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# kube-state-metrics: read-only Kubernetes API client, no pod-to-pod egress
# of its own. Ingress covered by prometheus-policy's egress rule above
# (NetworkPolicy allows are matched from both sides independently, so this
# still needs its own ingress rule to actually accept that traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443

---
# node-exporter: hostNetwork DaemonSet - see header comment #1. Written for
# documented intent, not real enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9100

---
# prometheus-operator: manages the Prometheus/Alertmanager StatefulSets and
# watches every monitoring.coreos.com CRD cluster-wide via the Kubernetes
# API. No ingress rule for its admission webhooks - see header comment #2 -
# but it does need one for Prometheus scraping its own /metrics (the
# observability-operator ServiceMonitor, port "https"/10250, TLS) - caught
# live, same class of gap as grafana-policy above (Egress-only policyTypes
# left ingress fully denied by the namespace's default-deny baseline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 10250
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
