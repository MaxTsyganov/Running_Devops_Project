# NetworkPolicy objects for the observability namespace. Applied by
# observability/scripts/install-observability.sh after the stack is up;
# labels were checked against real running Pods, not assumed from chart
# docs - same structure/caveats as jenkins/networkpolicies.yaml.
#
# Enforcement prerequisite: VPC CNI NetworkPolicy support (setup.sh step
# [4/11]) is already on cluster-wide.
#
# Two limitations inherited from AWS VPC CNI behavior (also documented in
# jenkins/networkpolicies.yaml):
#
# 1. node-exporter (hostNetwork: true) and kubelet/cAdvisor are reached at
#    the node's own IP, which standard NetworkPolicy can't meaningfully
#    constrain on this CNI. Egress rules below are scoped as tightly as
#    possible anyway (real private-subnet CIDRs, not 0.0.0.0/0), but are a
#    statement of intent, not real enforcement.
#
# 2. The prometheus-operator's admission webhooks are called into its Pod
#    by the EKS control plane, a source no selector can match, so no
#    ingress rule exists for it. Safe because `failurePolicy: Ignore` (the
#    chart default) means Kubernetes skips the webhook rather than
#    rejecting the request if this traffic is ever blocked; CI's
#    promtool/kubeconform validation is the real gate on those objects'
#    shape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny-all
  namespace: observability
spec:
  podSelector: {} # every pod in this namespace
  policyTypes:
    - Ingress
    - Egress
  # No rules under either key = deny all by default. Everything below is an
  # additive allow on top of this baseline.

---
# Prometheus: scrapes everything (devops-app, jenkins, its own namespace,
# and cluster-level kube-system targets), sends alerts to Alertmanager, and
# accepts queries from Grafana plus (per the CD pipeline's new Monitoring
# Gate, jenkins/cd/Jenkinsfile) cd-agent Pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
          podSelector:
            matchLabels:
              jenkins: slave
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 9113
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: devops-app
          podSelector:
            matchLabels:
              app: worker
      ports:
        - protocol: TCP
          port: 9100
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
          podSelector:
            matchLabels:
              app.kubernetes.io/component: jenkins-controller
      ports:
        - protocol: TCP
          port: 8080
    - to:
        # One combined rule for every same-namespace scrape target sharing
        # this direction; each port only matters to whichever pod actually
        # listens on it, so extra reachability is harmless. NetworkPolicy
        # needs both source egress and destination ingress independently
        # allowed - this rule originally omitted Prometheus's egress to
        # Grafana/operator even though their ingress rules existed.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app: kube-prometheus-stack-operator
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 10250
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 9153 # coredns's own /metrics, not the DNS port itself
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # this cluster's Service CIDR - kubernetes.default.svc for API-based service discovery, same rule/reasoning as jenkins-controller-policy's own
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.0.2.0/24 # this cluster's real private-subnet CIDRs (terraform/network.tf) - node-exporter/kubelet/kube-proxy, all hostNetwork - see header comment #1
        - ipBlock:
            cidr: 10.0.3.0/24
      ports:
        - protocol: TCP
          port: 9100 # node-exporter
        - protocol: TCP
          port: 10250 # kubelet + cAdvisor
        - protocol: TCP
          port: 10249 # kube-proxy
        # Port 443 here too: the "apiserver" ServiceMonitor's "endpoints"
        # discovery resolves straight to the API server's control-plane ENI
        # IPs, which land in these private subnets, not the 172.20.0.0/16
        # Service CIDR covered above.
        - protocol: TCP
          port: 443

---
# Alertmanager: accepts alerts from Prometheus (and Grafana's Alertmanager
# datasource queries) on 9093, plus its own /metrics on 8080 - the
# ServiceMonitor scrapes both endpoints, so allowing only 9093 left metrics
# scraping down. Egresses to Slack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0 # Slack's webhook endpoint - public, can't be scoped by IP, same reasoning as jenkins-agent-policy's own GitHub/ECR/KMS/PyPI rule
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Grafana: queries Prometheus and Alertmanager as datasources; its sidecar
# watches ConfigMaps cluster-wide via the Kubernetes API. Reachable itself
# only via kubectl port-forward, so no inbound-user-traffic ingress rule is
# needed (same posture as Jenkins/Prometheus/Alertmanager). Does need one
# ingress rule though: Prometheus scrapes Grafana's own /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16 # Kubernetes API - the dashboard/datasource sidecar's ConfigMap watch
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# kube-state-metrics: read-only Kubernetes API client, no pod-to-pod egress
# of its own. Still needs its own ingress rule since NetworkPolicy allows
# are matched from both sides independently.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443

---
# node-exporter: hostNetwork DaemonSet - see header comment #1. Written for
# documented intent, not real enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9100

---
# prometheus-operator: manages the Prometheus/Alertmanager StatefulSets and
# watches every monitoring.coreos.com CRD cluster-wide via the Kubernetes
# API. No ingress rule for its admission webhooks (see header comment #2),
# but it does need one for Prometheus scraping its own /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-operator-policy
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 10250
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
