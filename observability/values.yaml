# Helm values for prometheus-community/kube-prometheus-stack (Assignment 5).
# Overrides below were checked against the chart's shipped defaults at pin
# time, not guessed. Chart version is pinned in
# observability/scripts/install-observability.sh.

fullnameOverride: "observability"

prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    retention: "7d"
    # Chart defaults only match ServiceMonitor/PodMonitor/PrometheusRule
    # objects carrying this release's own label, which would silently miss
    # helm/devops-app and jenkins/ (separate releases/namespaces). Set
    # explicitly so a future chart-default change can't quietly narrow it.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    # Mounted at /etc/alertmanager/secrets/slack-webhook-url/; the Secret is
    # created by scripts/install-observability.sh at install time, never
    # committed here.
    secrets:
      - slack-webhook-url
  config:
    # inhibit_rules and the Watchdog->null route are the chart's stock
    # config, unchanged. Watchdog is the always-firing "pipeline is alive"
    # self-check, deliberately silenced rather than sent to Slack.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Chart default is 'null' (silently swallows everything, so a fresh
      # install never pages before it's configured). Re-routed to the
      # 'slack' receiver below.
      receiver: 'slack'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url/webhook-url
            channel: '#alerts'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}\n{{ .CommonAnnotations.runbook_url }}'
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  # No persistence set (chart default is disabled) - dashboards/datasources
  # are reproducible from Git via the sidecar below, so a reinstall
  # recreates everything identically.
  sidecar:
    dashboards:
      # Chart default is already ALL - set explicitly since dashboard
      # ConfigMaps (observability/dashboards/) live outside this Helm
      # release, and cross-namespace discovery has bitten this project
      # before.
      searchNamespace: ALL
