# Helm values for prometheus-community/kube-prometheus-stack (Assignment 5).
# Every default this file overrides below was checked directly against the
# chart's own shipped values.yaml at pin time ("helm show values
# prometheus-community/kube-prometheus-stack --version 88.5.4"), not
# guessed - same "checked, not guessed" standard as jenkins/values.yaml.
# Chart version itself is pinned in observability/scripts/install-observability.sh,
# same place jenkins/scripts/install-jenkins.sh pins JENKINS_CHART_VERSION.

fullnameOverride: "observability"

prometheus:
  prometheusSpec:
    scrapeInterval: "30s"
    retention: "7d"
    # Chart defaults for all three selectors below are "Nil...UsesHelmValues:
    # true", meaning "only match ServiceMonitor/PodMonitor/PrometheusRule
    # objects carrying this release's own label" - which would silently
    # never discover anything in helm/devops-app or jenkins/, both separate
    # Helm releases in different namespaces from this one. Same class of
    # gotcha already hit once for real with Jenkins' own Kubernetes cloud
    # config (jenkins/values.yaml's own header comment on that). The
    # matching *NamespaceSelector keys already default to {} (all
    # namespaces) in this chart version - set explicitly here anyway so a
    # future chart-default change can't quietly narrow it.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    # Mounted at /etc/alertmanager/secrets/slack-webhook-url/ - the Secret
    # itself is created by scripts/install-observability.sh at install time
    # (same $SLACK_WEBHOOK_URL / optional-if-unset pattern already used for
    # Jenkins build notifications), never committed here.
    secrets:
      - slack-webhook-url
  config:
    # inhibit_rules and the Watchdog->null sub-route are the chart's own
    # stock config, carried over unchanged - Watchdog is kube-prometheus's
    # always-firing "alerting pipeline is alive" self-check, deliberately
    # silenced rather than routed to Slack.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # The chart's own default here is 'null' - a receiver that silently
      # swallows everything, a deliberate upstream choice so a fresh install
      # never pages anyone before it's configured. Re-routed to the one real
      # receiver below; without this, every alert in observability/rules/
      # would fire correctly in Prometheus and vanish here with no error
      # anywhere.
      receiver: 'slack'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-url/webhook-url
            channel: '#alerts'
            send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}\n{{ .CommonAnnotations.runbook_url }}'
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  # No persistence set here at all (chart's own Grafana subchart default is
  # disabled) - every dashboard/datasource is reproducible from Git via the
  # sidecar below, so there's nothing in Grafana's own storage that a
  # reinstall doesn't already recreate identically.
  sidecar:
    dashboards:
      # Chart default is already ALL - set explicitly (not relied on
      # silently) since this repo's dashboard ConfigMaps
      # (observability/dashboards/) live outside this Helm release entirely
      # and cross-namespace discovery is exactly what this project has been
      # burned by assuming before.
      searchNamespace: ALL
